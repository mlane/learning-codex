 Three parts: storage for logs, Logs Explorer (the UI), and an API to manage logs in code.\n- Retention is 30 days by default (adjustable). To keep logs longer or use them elsewhere, export to Cloud Storage, BigQuery or Pub/Sub.\n- Logs exported to BigQuery can be queried with SQL and turned into reports and dashboards in Data Studio.\n- A sink is how the export is set up: a filter plus a destination. Built from Logs Explorer with Actions > Create Sink.\n- A sink only sends entries that arrive after it was created. Earlier logs are not copied over.\n- In Logs Explorer you narrow by resource (Subnetwork) and log name (`vpc_flows`), then add text such as an IP address on a new line of the query.\n- Log buckets: `_Required` holds Admin Activity and System Event audit logs for 400 days, free and unchangeable. `_Default` holds the rest for 30 days. Custom buckets set their own retention and region.\n- Audit log types: Admin Activity (always on), Data Access (off by default except BigQuery; can be large and costly), System Event, Policy Denied.\n- Centralised logging: an aggregated sink at folder or organization level collects from every project below into one destination.\n- Destination by purpose: Cloud Storage for cheap long retention, BigQuery for analysis, Pub/Sub to stream to a SIEM or other tool, another log bucket to centralise.\n- Exclusion filters drop noisy logs before they're stored and billed. Log-based metrics turn matching entries into a metric to alert on.\n- Log Analytics runs SQL over a log bucket without exporting it.\n- Tamper-proof audit trail: a locked retention policy on the bucket.\nLike what I know: console.log for the whole platform, collected in one searchable place. Sentry or a log drain, built in.\n\n## Isolate\nPick it when: You need to search, keep or audit what happened: application and system logs, with export for long-term storage or analysis.\nNot it when (use Cloud Monitoring instead): You need metrics, uptime checks and alert thresholds rather than the log entries themselves.\n\n## Execute\nWhat I built: Course lab, 2026-11-24. Apache `web-server` (e2-micro, tag `http-server`) on a subnet with VPC Flow Logs on, and a firewall rule opening tcp 80 and 22 to that tag. Opened the page, then found my own IP in the `vpc_flows` entries in Logs Explorer. Created sink `bq_vpcflows` to a new BigQuery dataset of the same name, sent 50 curls from Cloud Shell, and queried the table for the top talkers by bytes. Cloud Shell's IP came out on top; my own machine's earlier visits weren't there because they happened before the sink existed.\n\n```bash\nexport MY_SERVER=\u003cexternal IP of web-server>\nfor ((i=1;i\u003c=50;i++)); do curl $MY_SERVER; done\n```\n\n```sql\n#standardSQL\nSELECT\n  jsonPayload.connection.src_ip,\n  jsonPayload.connection.dest_ip,\n  SUM(CAST(jsonPayload.bytes_sent AS INT64)) AS bytes,\n  jsonPayload.connection.dest_port,\n  jsonPayload.connection.protocol\nFROM `your_table_id`\nWHERE jsonPayload.reporter = 'DEST'\nGROUP BY 1, 2, 4, 5\nORDER BY bytes DESC\nLIMIT 15\n```\n\n- The table name starts with `compute_googleapis`. Use the Table ID without the project ID in front.\n\n## Missed\n"},{"id":"ops-monitoring","name":"Cloud Monitoring","district":"ops","threat":2,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Takes in metrics, events and metadata from your resources and turns them into dashboards, charts and alerts. It configures itself after resources are deployed, with sensible defaults. Part of Google Cloud Observability; monitoring is the base of SRE.\n- Metrics scope: one scoping project holds the custom dashboards, alerting policies, uptime checks, notification channels and groups for every project it monitors. The scope takes that project's name.\n- Vocabulary: a metric is a collection of measurements (request latency, free disk space); the thing being measured is a monitored resource.\n- Charts on custom dashboards show VM utilization and network traffic: CPU, packets or bytes sent and received, packets dropped by the firewall. Filters cut noise, groups reduce the number of time series, aggregates combine them.\n- Charts only help while someone is looking. Uptime checks plus alerting policies are the pair that tells you a web server is unreachable.\n- Uptime checks: test a public service from locations around the world over HTTP, HTTPS or TCP. Every minute with a 10-second timeout in the lecture's example; both are adjustable. Targets in the lecture: a URL, a Compute Engine instance, an App Engine app, an AWS instance or load balancer. Each check can have its own alerting policy and shows latency per location.\n- Alerting: a policy watches metrics in Monitoring or logs in Logging; when a condition is met, it opens an incident and notifies by email, SMS, webhook, Pub/Sub or a third-party service. It can also warn before Observability usage itself hits a billing threshold. Fewer, actionable alerts are what reduce alert fatigue.\n- Ops Agent: the hypervisor can't see inside a VM (memory and disk usage, for two), so the agent runs in the VM and collects it. Primary agent for Compute Engine telemetry and Google's recommended one. A single install collects system metrics plus logs and metrics from third-party software (Apache, MySQL). It replaces the legacy Stackdriver logging and monitoring agents. Stackdriver is the company Google bought; the name still shows up in APIs.\n- Custom metrics: send an app-level number (current users) straight to Monitoring instead of guessing from CPU or network load. An autoscaler can hold it at a utilization target, adding VMs above it and removing them below.\n- Network-specific monitoring and troubleshooting is Network Intelligence Center: see `network-intelligence-center`.\n- Same suite: Error Reporting counts and groups errors in running services. Cloud Trace shows request latency and how requests travel through the app. Cloud Profiler finds CPU- or memory-heavy functions.\n- Managed Service for Prometheus: keep an existing Prometheus setup and its PromQL queries, with Google running the backend. The answer for \"migrate Prometheus without rewriting queries\".\n- PromQL is now the query language in Metrics Explorer. MQL (Monitoring Query Language) is deprecated: no new MQL charts or alerts from the console, existing ones keep working.\n- What to watch on any service, the four golden signals: latency, traffic, errors, saturation.\n- SLO monitoring: define an SLO on a service and alert on how fast the error budget burns. See `ops-sre-slos`.\n- Alerting strategy (exam guide 6.2): alert on symptoms users feel, not on every cause; page for the urgent, open a ticket for the rest.\n- Case study hooks: EHR Healthcare has open source tools and email alerts that get ignored (centralise here, with real notification channels). Cymbal Retail runs Grafana, Nagios and Elastic; Managed Service for Prometheus keeps PromQL and Grafana dashboards working.\nLike what I know: Real-user monitoring and uptime dashboards (Datadog, Grafana): Web Vitals, but for servers.\n\n## Isolate\nPick it when: The question is whether something is up, healthy or fast enough: metrics, uptime checks, dashboards, alerts.\nNot it when (use Cloud Logging instead): You need the record of what happened (entries to search, keep or audit), not numbers over time.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ops-sre-slos","name":"SLIs, SLOs and error budgets","district":"ops","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: The vocabulary Google's Site Reliability Engineering uses to decide how reliable a service needs to be, and when to slow down releases.\n- SLI (indicator): a measurement of what users experience, as good events over all events. E.g. the share of requests answered within 300 ms.\n- SLO (objective): the target for an SLI over a window. E.g. 99.9% of requests succeed over 28 days. An internal goal.\n- SLA (agreement): a promise to customers with a penalty if broken. Always looser than the SLO, to leave room to react.\n- Error budget: 100% minus the SLO. Budget left: ship features. Budget spent: freeze releases and fix reliability. It turns 'dev wants speed, ops wants stability' into one number both agree on.\n- Downtime allowed per 30 days: 99% is 7.2 hours, 99.9% is 43 minutes, 99.95% is 22 minutes, 99.99% is 4.3 minutes, 99.999% is 26 seconds. Each extra nine costs far more than the last.\n- Dependencies in a chain multiply: two 99.9% services in series give about 99.8%. Redundant copies in parallel raise it. A service can't be more reliable than what it depends on.\n- Four golden signals: latency, traffic, errors, saturation.\n- Burn-rate alerts fire when the budget is being spent too fast, instead of on every blip.\n- Toil is manual, repetitive work that grows with the service; SRE automates it away. Postmortems are blameless: fix the system, not the person.\n- Releases that protect the budget: rolling update (replace gradually), blue/green (two full environments, switch traffic), canary (a small share first), each with a quick rollback.\n- Proving reliability on purpose (exam guide 4.3 and 6.6): chaos engineering injects failures (kill a VM, cut a zone) to show the system survives; load testing finds the limit; penetration testing hunts security holes, and needs no notice to Google on your own projects.\nLike what I know: Performance budgets. A Core Web Vitals threshold is an SLO; the error budget is how much slack is left before feature work stops and performance work starts.\n\n## Isolate\nPick it when: The question is how reliable is reliable enough, whether to release or freeze, or what to alert on. Define SLIs, set an SLO, manage the error budget.\nNot it when (use RTO and RPO instead): The question is recovering from a disaster: how long to restore and how much data can be lost. That is `ops-disaster-recovery`.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-command-center","name":"Security Command Center","district":"security","threat":1,"estimate":true,"livesAt":"organization","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Central view of security posture across the organization: misconfigurations, vulnerabilities and threats, reported as findings.\n- Tiers: Standard (no extra charge), Premium, Enterprise (adds AWS and Azure).\n- Database Center is the same idea for the database fleet, and draws on Security Command Center data.\n- Built-in detectors: Security Health Analytics (misconfigurations: public buckets, open firewall rules, missing MFA), Event Threat Detection (threats found in logs), Container Threat Detection, Web Security Scanner, and attack path simulation that shows how findings chain toward valuable resources.\n- Compliance view: maps findings to standards (CIS benchmarks, PCI DSS and others).\n- Findings can be exported to Pub/Sub or BigQuery, or muted.\n- AI Protection inventories AI assets (models, datasets, agents) and their risks, and works with Model Armor.\n- Status check (2026): the Enterprise tier was deprecated in May 2026 and shuts down in May 2027, with those customers moving to Premium. Exam material can still describe three tiers.\nLike what I know: A Lighthouse or npm audit report for the whole cloud organization: one ranked list of findings.\n\n## Isolate\nPick it when: You need one place that shows misconfigurations, vulnerabilities and active threats across every project, or a view of posture against a compliance standard.\nNot it when (use Cloud Logging and Monitoring instead): You're investigating one application's behaviour or alerting on a metric. To prevent a misconfiguration instead of detecting it afterwards, Organization Policy.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-compliance","name":"Compliance and shared responsibility","district":"security","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Who secures what, and which standards the platform helps you meet.\n- Shared responsibility: Google secures the infrastructure; you secure your configuration, access and data. The more managed the service, the more of the work is Google's.\n- So the order of preference is serverless first, then fully managed, then VMs. VMs leave the most to configure and the most to get wrong.\n- Covered at baseline (trainer's list): ISO 27001, SOC 2, PCI DSS, FIPS 140-2.\n- Needs extra work from you: HIPAA (healthcare APIs and services help) and FedRAMP.\n- No separate government regions, unlike AWS and Azure. Assured Workloads applies compliance controls inside the standard regions.\n- Zero trust (BeyondCorp) pieces to recognise: IAP, VPC Service Controls, Sensitive Data Protection, Cloud Armor, Security Command Center.\n- Regulations by case study: GDPR for EU personal data (KnightMotives names EU data protection); HIPAA for US health data (EHR Healthcare; needs a Business Associate Agreement with Google and only covered services); PCI DSS for card data (retail). The exam guide also lists children's privacy (COPPA) and uses SOC 2 as its example certification.\n- Data residency toolkit: region choice, the resource locations org policy, Assured Workloads, CMEK or external keys, VPC Service Controls.\n- Audit evidence: Cloud Audit Logs for what your people did, Access Transparency for what Google staff did, Access Approval to require your sign-off before they do it. Google's own audit reports come from Compliance Reports Manager.\n- Stricter sovereignty: Google Distributed Cloud for an air-gapped or on-prem deployment.\nLike what I know: Using a hosted auth provider: they secure the platform, and I'm still responsible for how I configure and use it.\n\n## Isolate\nPick it when: The scenario names a regulation (HIPAA, PCI DSS, FedRAMP) or a data residency rule. Start from what Google already covers, then add the controls that are yours.\nNot it when (use Organization Policy instead): The need is only to restrict where or what can be created, with no named standard behind it.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-iap","name":"Identity-Aware Proxy","district":"security","threat":2,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: A proxy in front of an app that enforces access control policies per user. The user signs in first, then IAP checks their IAM role before the request reaches the app. No VPN needed.\n- Access is decided at the application level, centrally, instead of by network firewalls.\n- Part of Google's zero trust model (BeyondCorp): no network is trusted, and every request is checked for who the user is and the context it comes from.\n- IAP tunnels let you SSH to a VM that has no external IP.\n- Fronts apps behind an Application Load Balancer, on App Engine, Cloud Run, GKE and Compute Engine, and on-prem apps through a connector.\n- Roles: IAP-secured Web App User for web apps, IAP-secured Tunnel User for SSH and RDP tunnels. The firewall must allow 35.235.240.0/20 for tunnels.\n- Context-aware access: on top of identity, require an access level (company-managed device, IP range, location), defined in Access Context Manager. Named in the exam guide.\n- Chrome Enterprise Premium is the paid zero-trust product built around this (formerly BeyondCorp Enterprise): context-aware access plus threat and data protection in the browser. Also in the exam guide, under secure remote access.\nLike what I know: An auth guard in front of a route, like login middleware, except it runs outside the app and the app never sees unauthenticated traffic.\n\n## Isolate\nPick it when: Staff need to reach an internal app from anywhere and access should depend on who they are, not which network they're on.\nNot it when (use Cloud VPN or Interconnect instead): Two networks need to be connected (on-prem to VPC), rather than users let into one app.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-kms","name":"Cloud KMS and encryption keys","district":"security","threat":2,"estimate":true,"livesAt":"regional, multi-region or global (set per key ring)","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Managed service that creates, holds and uses encryption keys. Apps and Google services ask it to encrypt or decrypt; the key itself never leaves. Structure: key ring, then key, then key versions.\n- Who controls the key, least to most effort. Google default encryption: everything is encrypted at rest already, nothing to do. CMEK (customer-managed): your key in Cloud KMS; you control rotation and access and can disable it. CSEK (customer-supplied): you send the raw key with each request, only for Cloud Storage and Compute Engine disks. Cloud EKM (external): the key stays in a third-party key manager outside Google.\n- Protection levels: software, HSM (hardware security module, multi-tenant or single-tenant), external. It can't be changed after the key is created.\n- Autokey creates and assigns CMEK keys automatically as resources are created, following recommended practice (HSM level, yearly rotation, keys kept apart from the resources).\n- Rotation: automatic on a schedule for symmetric keys; older versions stay so old data can still be decrypted. Destroying a key version, after a waiting period, makes its data unreadable for good (crypto-shredding).\n- Envelope encryption: the data is encrypted with a data key, and that data key is encrypted with the KMS key.\n- Separation of duties: keys live in their own project, and whoever administers keys doesn't hold the encrypt and decrypt role.\n- A CMEK key must be in the same location as the resource it protects. An org policy can require CMEK on new resources.\nLike what I know: A password manager for encryption keys: the service keeps the key and does the encrypting; the app never holds it.\n\n## Isolate\nPick it when: A regulation or policy says you must control the encryption keys: rotate them, revoke access, prove who used them (CMEK). If the keys must stay outside Google, Cloud EKM.\nNot it when (use Secret Manager instead): You're storing a secret value such as an API key or a database password, not encrypting data. If nobody requires key control, Google's default encryption already covers it.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-model-armor","name":"Model Armor","district":"security","threat":1,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: A filter that sits between an app and an LLM. It screens prompts on the way in and responses on the way out, and blocks or flags what breaks policy.\n- Catches: prompt injection and jailbreak attempts, sensitive data going in or coming out (it uses Sensitive Data Protection), malicious URLs, and harmful content.\n- Model-agnostic: works in front of Gemini, other models on Vertex AI, or models hosted elsewhere.\n- Policies are templates with a confidence level per filter. Floor settings enforce a minimum across an organization or folder.\n- Named in the exam guide under AI security, next to Sensitive Data Protection and secure model deployment.\n- Look-alike name: Cloud Armor is the web application firewall at the load balancer. Different product.\nLike what I know: Input validation and output escaping, the way I'd stop XSS, applied to LLM prompts and responses.\n\n## Isolate\nPick it when: A generative AI app takes untrusted input or shows model output to users, and both need screening (Cymbal's shopping assistant, Altostrat's content tools).\nNot it when (use Sensitive Data Protection instead): Finding or masking sensitive data in storage and databases, with no LLM in the path. For web attacks on the app's endpoint, Cloud Armor.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-secret-manager","name":"Secret Manager","district":"security","threat":2,"estimate":true,"livesAt":"global, or regional (regional secrets)","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: A managed store for small sensitive values: API keys, database passwords, certificates. Apps fetch the value at run time instead of carrying it in code, config files or images.\n- A secret has versions. Add a version to rotate; an app pins a version or reads `latest`; old versions can be disabled or destroyed.\n- Access is IAM per secret (Secret Manager Secret Accessor), and every read lands in the audit logs.\n- Replication: automatic (Google picks the regions) or user-managed (you name them, for residency). Regional secrets keep everything in one region.\n- A rotation schedule only sends a Pub/Sub message when it's time; your function does the rotating.\n- Encrypted by default; CMEK optional.\n- Built into the runtimes: Cloud Run and Cloud Run functions expose a secret as an environment variable or a mounted file, GKE through an add-on, Cloud Build inside build steps.\n- Parameter Manager is the companion for configuration that isn't secret.\nLike what I know: A .env file done properly: versioned, access-controlled and audited. GitHub Actions secrets, for the whole platform.\n\n## Isolate\nPick it when: An app or pipeline needs a credential at run time and it must not sit in source code, an image or a Terraform file.\nNot it when (use Cloud KMS instead): You need to encrypt data or manage encryption keys. For a workload calling Google APIs you need no secret at all: attach a service account, or use Workload Identity Federation from outside Google Cloud.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-sensitive-data-protection","name":"Sensitive Data Protection (DLP)","district":"security","threat":2,"estimate":true,"livesAt":"global or regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Finds, classifies and de-identifies sensitive data: PII, card numbers, health records. Formerly Cloud DLP (Data Loss Prevention); the API is still the DLP API, and the trainer and exam may use either name.\n- Discovery and inspection across Cloud Storage, BigQuery and other stores, using built-in detectors (infoTypes).\n- De-identification: masking, redaction, tokenization.\n- The discovery service profiles BigQuery, Cloud SQL and Cloud Storage across the organization continuously and reports where sensitive data sits and how risky it is.\n- De-identification choices: redaction (remove it), masking (replace characters), tokenization or format-preserving encryption (reversible with a key), bucketing and date shifting (keep the data useful for analysis).\n- Typical pipeline: a file lands in a bucket, a function calls the DLP API, clean data goes on and sensitive data goes to a quarantine bucket.\n- AI use: strip personal data from prompts and training data. Model Armor's sensitive data filter uses it. The exam guide lists it under AI security.\n- Custom infoTypes (regular expressions, dictionaries) cover your own identifiers.\nLike what I know: A linter that scans data for personal information instead of code for bugs, with an auto-fix that redacts.\n\n## Isolate\nPick it when: You need to know where sensitive data is, or to mask it before sharing or analysing it.\nNot it when (use Cloud KMS instead): The data needs encrypting with keys you control. To stop data leaving a boundary, VPC Service Controls.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-vpc-service-controls","name":"VPC Service Controls","district":"security","threat":2,"estimate":true,"livesAt":"organization","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: A service perimeter around projects and the Google-managed services in them (Cloud Storage, BigQuery and others). API calls that cross the perimeter are blocked unless a rule allows them, even when IAM would allow them. The defence against data exfiltration.\n- IAM decides who. VPC Service Controls decides from where: stolen credentials used from outside the perimeter don't work.\n- Access levels and ingress and egress rules open controlled paths across. Dry-run mode tests a perimeter before enforcing it.\n- Trainer: one of the fundamentals to know.\n- It works alongside IAM, not instead of it: a request must pass both.\n- Access levels come from Access Context Manager (IP range, device state, identity).\n- On-prem can sit inside a perimeter by reaching the APIs through `restricted.googleapis.com` over VPN or Interconnect.\n- Usual breakage: a perimeter blocks a service account or console user that worked before. Run dry-run first and read the violation logs.\nLike what I know: A Content Security Policy for Google APIs. CSP lists which origins a page may talk to; a perimeter lists which networks and projects may call the API.\n\n## Isolate\nPick it when: The worry is data leaving: exfiltration from managed services, or a compliance boundary around sensitive data.\nNot it when (use VPC firewall rules instead): Controlling network traffic between VMs. VPC Service Controls guards Google APIs, not packets.\n\n## Execute\nWhat I built:\n\n## Missed\n"}],"bosses":[{"id":"case-altostrat-media","name":"Altostrat Media","tagline":"Media and content management","parts":[{"title":"Company in one line","done":false},{"title":"Business requirements","done":false},{"title":"Technical requirements","done":false},{"title":"My architecture","done":false},{"title":"Service picks","done":false}],"hp":100,"missed":[],"body":"\n## Company in one line\n\u003c!-- Who they are and what they sell, in your words. -->\n\n## Business requirements\n\u003c!-- What the business wants. These decide the \"best\" answer when two options both work. -->\n\n## Technical requirements\n\u003c!-- What exists today and what the solution must do. -->\n\n## My architecture\n\u003c!-- Draw it as a Mermaid code block. GitHub renders it. -->\n\n## Service picks\n\u003c!-- One line each: service, and the requirement that made you pick it. -->\n\n## Missed\n"},{"id":"case-cymbal-retail","name":"Cymbal Retail","tagline":"Digital retail and integration","parts":[{"title":"Company in one line","done":false},{"title":"Business requirements","done":false},{"title":"Technical requirements","done":false},{"title":"My architecture","done":false},{"title":"Service picks","done":false}],"hp":100,"missed":[],"body":"\n## Company in one line\n\u003c!-- Who they are and what they sell, in your words. -->\n\n## Business requirements\n\u003c!-- What the business wants. These decide the \"best\" answer when two options both work. -->\n\n## Technical requirements\n\u003c!-- What exists today and what the solution must do. -->\n\n## My architecture\n\u003c!-- Draw it as a Mermaid code block. GitHub renders it. -->\n\n## Service picks\n\u003c!-- One line each: service, and the requirement that made you pick it. -->\n\n## Missed\n"},{"id":"case-ehr-healthcare","name":"EHR Healthcare","tagline":"Healthcare software, the one older case study","parts":[{"title":"Company in one line","done":false},{"title":"Business requirements","done":false},{"title":"Technical requirements","done":false},{"title":"My architecture","done":false},{"title":"Service picks","done":false}],"hp":100,"missed":[],"body":"\n## Company in one line\n\u003c!-- Who they are and what they sell, in your words. -->\n\n## Business requirements\n\u003c!-- What the business wants. These decide the \"best\" answer when two options both work. -->\n\n## Technical requirements\n\u003c!-- What exists today and what the solution must do. -->\n\n## My architecture\n\u003c!-- Draw it as a Mermaid code block. GitHub renders it. -->\n\n## Service picks\n\u003c!-- One line each: service, and the requirement that made you pick it. -->\n\n## Missed\n"},{"id":"case-knightmotives-automotive","name":"KnightMotives Automotive","tagline":"Smart manufacturing","parts":[{"title":"Company in one line","done":false},{"title":"Business requirements","done":false},{"title":"Technical requirements","done":false},{"title":"My architecture","done":false},{"title":"Service picks","done":false}],"hp":100,"missed":[],"body":"\n## Company in one line\n\u003c!-- Who they are and what they sell, in your words. -->\n\n## Business requirements\n\u003c!-- What the business wants. These decide the \"best\" answer when two options both work. -->\n\n## Technical requirements\n\u003c!-- What exists today and what the solution must do. -->\n\n## My architecture\n\u003c!-- Draw it as a Mermaid code block. GitHub renders it. -->\n\n## Service picks\n\u003c!-- One line each: service, and the requirement that made you pick it. -->\n\n## Missed\n"}],"weeks":[{"title":"Pre-work","start":null,"hours":"","items":[{"text":"Read the Professional Cloud Architect exam guide","done":false,"key":null},{"text":"Try the official sample questions once, cold, and log the score in quizzes.md","done":false,"key":null},{"text":"Skim all four case studies","done":false,"key":null}]},{"title":"Week 1","start":"2026-11-03","hours":"~9h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":true,"key":null},{"text":"Course: Google Cloud Fundamentals: Core Infrastructure","done":true,"key":null},{"text":"Course: Essential Google Cloud Infrastructure: Core Services","done":true,"key":null},{"text":"Badge: Implement Load Balancing on Compute Engine","done":true,"key":"key"}]},{"title":"Week 2","start":"2026-11-10","hours":"~15h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":true,"key":null},{"text":"Course: Networking in Google Cloud: Fundamentals","done":true,"key":null},{"text":"Course: Elastic Google Cloud Infrastructure: Scaling and Automation","done":false,"key":null},{"text":"Badge: Set Up an App Dev Environment on Google Cloud"," ems":[{"text":"Clear every breached entry","done":false,"key":null},{"text":"Defeat all four bosses","done":false,"key":null},{"text":"Reach 85% on a full practice run","done":false,"key":null},{"text":"Sit the exam","done":false,"key":null}]}],"quizzes":[]}]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('codex-data').textContent);
  const app = document.getElementById('app');
  const sheet = document.getElementById('sheet');
  const sheetBody = document.getElementById('sheet-body');
  const LEVELS = ['Locked', 'Seen', 'Scanned', 'Owned'];
  const DEPTH = ['', 'basics', 'medium', 'advanced', 'expert'];
  const PROMPT = /^\s*(What it is|Like what I know|Pick it when|Not it when[^:]*|What I built)\s*:/i;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const today = new Date();
  const daysUntil = (iso) => Math.ceil((new Date(iso + 'T23:59:59') - today) / 864e5);
  const niceDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const isBreached = (x) => x.missed.some((m) => !m.resolved);

  if (typeof DATA === 'string' || !DATA.cities || !DATA.cities.length) {
    app.innerHTML = '<h1>No city yet</h1><p class="sub">Create one with <code>node codex.mjs city my-topic "My topic"</code>, then run <code>node codex.mjs build</code>.</p>';
    return;
  }

  let city = DATA.cities[0];
  if (DATA.cities.length > 1) {
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'City');
    sel.innerHTML = DATA.cities.map((c, i) => `<option value="${i}">${esc(c.title)}</option>`).join('');
    sel.onchange = () => { city = DATA.cities[+sel.value]; render(); };
    document.getElementById('switch').append(sel);
  }

  // ---------- small Markdown renderer for the entry sheet ----------
  function inline(s, base) {
    return esc(s)
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => `<img alt="${alt}" src="${/^(https?:|data:|\/)/.test(src) ? src : base + '/' + src}">`)
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function md(src, base) {
    const lines = src.replace(/<!--[\s\S]*?-->/g, '').split(/\r?\n/);
    let html = '', code = null, list = false, para = [], table = [];
    const endP = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
    const endL = () => { if (list) { html += '</ul>'; list = false; } };
    const endT = () => {
      if (!table.length) return;
      const rows = table.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim(), base)));
      html += '<table>' + rows.map((r, i) => '<tr>' + r.map((c) => (i ? `<td>${c}</td>` : `<th>${c}</th>`)).join('') + '</tr>').join('') + '</table>';
      table = [];
    };
    const endAll = () => { endP(); endL(); endT(); };
    for (const line of lines) {
      if (line.trim().startsWith('```')) {
        if (code) { html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; code = null; }
        else { endAll(); code = []; }
        continue;
      }
      if (code) { code.push(line); continue; }
      const h = line.match(/^(#{2,4})\s+(.*)/);
      if (h) { endAll(); const n = h[1].length + 1; html += `<h${n}>${inline(h[2], base)}</h${n}>`; continue; }
      if (/^\s*\|/.test(line)) { endP(); endL(); table.push(line); continue; }
      const li = line.match(/^\s*[-*]\s+(?:\[( |x|X)\]\s+)?(.*)/);
      if (li) {
        endP(); endT();
        if (!list) { html += '<ul>'; list = true; }
        const box = li[1] === undefined ? '' : `<span class="box${li[1] === ' ' ? '' : ' on'}"></span>`;
        html += `<li>${box}<span>${inline(li[2], base)}</span></li>`;
        continue;
      }
      if (!line.trim()) { endAll(); continue; }
      endL(); endT();
      const p = line.match(PROMPT);
      if (p) {
        const rest = line.slice(p[0].length).trim();
        para.push(`<span class="prompt">${esc(p[0].trim())}</span> ${rest ? inline(rest, base) : '<span class="prompt">not written yet</span>'}`);
      } else para.push(inline(line, base));
    }
    if (code) html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>';
    endAll();
    return html;
  }

  // ---------- sheet ----------
  function openCard(id) {
    const c = city.cards.find((x) => x.id === id);
    if (!c) return;
    const next = c.level === 3 ? 'All three parts are written.'
      : !c.b ? 'Next: write Baseline to mark it Seen.'
      : !c.i ? 'Next: write Isolate to mark it Scanned.'
      : !c.e ? 'Next: build something and record it under Execute to own it.'
      : 'Write the earlier parts too; status goes in order.';
    const open = c.missed.filter((m) => !m.resolved).length;
    sheetBody.innerHTML = `
      <div class="sheet-top"><h2 id="sheet-title">${esc(c.name)}</h2><button class="close" data-close>Close</button></div>
      <p class="state"><b class="l${c.level}">${LEVELS[c.level]}</b>. ${next}
        ${open ? `<span class="br">Breached: ${plural(open, 'missed question', 'missed questions')} to resolve.</span>` : ''}</p>
      <p class="muted">Depth needed: ${DEPTH[c.threat]} (${c.threat} of 4${c.estimate ? ', estimate' : ', from the trainer sheet'}).
        ${c.livesAt ? 'Lives at: ' + esc(c.livesAt) + '.' : 'Lives at: not set yet (zonal, regional, multi-regional or global).'}</p>
      <p class="path">cities/${esc(city.id)}/cards/${esc(c.id)}.md</p>
      <div class="note">${md(c.body, `cities/${city.id}/cards`)}</div>`;
    sheet.showModal();
  }
  function openBoss(id) {
    const b = city.bosses.find((x) => x.id === id);
    if (!b) return;
    const done = b.parts.filter((p) => p.done).length;
    sheetBody.innerHTML = `
      <div class="sheet-top"><h2 id="sheet-title">${esc(b.name)}</h2><button class="close" data-close>Close</button></div>
      <p class="state">${b.hp === 0 ? 'Defeated.' : `HP ${b.hp}%. ${done} of ${b.parts.length} parts written.`}</p>
      <p class="path">cities/${esc(city.id)}/bosses/${esc(b.id)}.md</p>
      <div class="note">${md(b.body, `cities/${city.id}/bosses`) || '<p class="muted">Nothing written yet.</p>'}</div>`;
    sheet.showModal();
  }
  sheet.addEventListener('click', (e) => { if (e.target === sheet || e.target.closest('[data-close]')) sheet.close(); });

  // ---------- page ----------
  function render() {
    const cards = city.cards;
    const count = (l) => cards.filter((c) => c.level === l).length;
    const power = cards.length ? Math.round((100 * cards.reduce((s, c) => s + c.level, 0)) / (3 * cards.length)) : 0;
    const byDistrict = city.districts.map((d) => ({
      ...d,
      cards: cards.filter((c) => c.district === d.id).sort((a, b) => b.threat - a.threat || a.name.localeCompare(b.name)),
    })).filter((d) => d.cards.length);

    // skyline
    let n = 0;
    const towers = byDistrict.map((d) => `
      <div class="plot"><div class="tower"><div class="windows">${d.cards.map((c) => {
        const delay = c.level ? ` style="animation-delay:${(n++ * 35)}ms"` : '';
        const label = `${c.name}: ${LEVELS[c.level]}${isBreached(c) ? ', breached' : ''}`;
        return `<button class="win l${c.level}${c.level ? ' lit' : ''}${isBreached(c) ? ' breached' : ''}" data-card="${esc(c.id)}" title="${esc(label)}" aria-label="${esc(label)}"${delay}></button>`;
      }).join('')}</div></div>
      <div class="plot-label"><b>${esc(d.name)}</b>${d.cards.filter((c) => c.level === 3).length} of ${d.cards.length} owned</div></div>`).join('');

    // deadline
    const upcoming = city.milestones.filter((m) => daysUntil(m.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
    const last = city.milestones.length ? [...city.milestones].sort((a, b) => a.date.localeCompare(b.date)).pop() : null;
    const deadline = !last ? '<span class="big">No dates</span><small>Add milestones in city.json.</small>'
      : daysUntil(last.date) < 0 ? `<span class="big">Past</span><small>${esc(last.label)} was ${niceDate(last.date)}.</small>`
      : `<span class="big">${plural(daysUntil(last.date), 'day', 'days')}</span><small>${esc(last.label)}, ${niceDate(last.date)}.${upcoming[0] && upcoming[0] !== last ? ` Next: ${esc(upcoming[0].label.toLowerCase())} in ${plural(daysUntil(upcoming[0].date), 'day', 'days')}.` : ''}</small>`;

    // keys
    const keys = city.weeks.flatMap((w) => w.items.filter((i) => i.key));
    const keysDone = keys.filter((k) => k.done).length;
    const reqLeft = keys.filter((k) => k.key === 'required' && !k.done);
    const gateOpen = keys.length && keysDone >= city.keysNeeded && !reqLeft.length;
    const keyHtml = !keys.length ? '<span class="big">None</span><small>Tag a quest with {key} to track badges.</small>'
      : `<span class="big">${keysDone} of ${keys.length}</span>
         <div class="keys">${keys.map((k) => `<i class="${k.key === 'required' ? 'req ' : ''}${k.done ? 'on' : ''}" title="${esc(k.text)}"></i>`).join('')}</div>
         <small>${gateOpen ? 'Gate open. Apply for the voucher.' : `Gate opens at ${city.keysNeeded}${reqLeft.length ? ', and the amber key is required' : ''}.`}</small>`;

    // sync rate
    const qz = city.quizzes;
    const got = qz.reduce((s, q) => s + q.got, 0), total = qz.reduce((s, q) => s + q.total, 0);
    const lastQ = qz.length ? [...qz].sort((a, b) => a.date.localeCompare(b.date)).pop() : null;
    const sync = !qz.length ? `<span class="big">No data</span><small>Log a quiz in quizzes.md. Target ${city.targetAccuracy}%.</small>`
      : `<span class="big">${Math.round((100 * got) / total)}%</span><small>Across ${plural(qz.length, 'quiz', 'quizzes')}. Last: ${esc(lastQ.label)}, ${lastQ.got}/${lastQ.total}. Target ${city.targetAccuracy}%.</small>`;

    // entries
    const districts = byDistrict.map((d) => {
      const pct = (l) => (100 * d.cards.filter((c) => c.level === l).length) / d.cards.length;
      return `<section class="district">
        <div class="district-head"><h2>${esc(d.name)}</h2><span>${d.cards.filter((c) => c.level === 3).length} of ${d.cards.length} owned</span></div>
        <div class="meter"><i class="m3" style="width:${pct(3)}%"></i><i class="m2" style="width:${pct(2)}%"></i><i class="m1" style="width:${pct(1)}%"></i></div>
        ${d.cards.map((c) => `<button class="entry l${c.level}${isBreached(c) ? ' breached' : ''}" data-card="${esc(c.id)}">
          <span class="bie" title="Baseline, Isolate, Execute"><i class="b${c.b ? ' on' : ''}"></i><i class="i${c.i ? ' on' : ''}"></i><i class="e${c.e ? ' on' : ''}"></i></span>
          <span><span class="entry-name">${esc(c.name)}</span><span class="entry-id">${esc(c.id)}</span></span>
          <span class="entry-lives">${esc(c.livesAt)}</span>
          <span class="pips" title="Depth needed: ${DEPTH[c.threat]}${c.estimate ? ' (estimate)' : ' (trainer sheet)'}">${[1, 2, 3, 4].map((k) => `<i class="${k <= c.threat ? 'on' : ''}"></i>`).join('')}${c.estimate ? '<span>~</span>' : ''}</span>
        </button>`).join('')}
      </section>`;
    }).join('');

    // quests
    const dated = city.weeks.filter((w) => w.start);
    let current = null;
    for (const w of dated) if (new Date(w.start + 'T00:00:00') <= today) current = w;
    const idx = current ? city.weeks.indexOf(current) : -1;
    const earlier = city.weeks.filter((w, i) => (idx < 0 ? !w.start : i < idx) && w.items.some((x) => !x.done));
    const later = city.weeks.filter((w, i) => (idx < 0 ? !!w.start : i > idx));
    const item = (x) => `<li class="${x.done ? 'done' : ''}"><span class="box${x.done ? ' on' : ''}"></span><span>${esc(x.text)}${x.key ? `<span class="tag${x.key === 'required' ? ' req' : ''}">${x.key === 'required' ? 'required key' : 'key'}</span>` : ''}</span></li>`;
    const backlog = earlier.reduce((s, w) => s + w.items.filter((x) => !x.done).length, 0);
    const quests = !city.weeks.length ? '<p class="muted">No quests. Add weeks to quests.md.</p>' : `
      ${current ? `<p class="muted">${esc(current.title)}${current.hours ? ', ' + esc(current.hours) : ''}</p><ul class="checks">${current.items.map(item).join('')}</ul>` : '<p class="muted">Nothing has started yet.</p>'}
      ${backlog ? `<details${current ? '' : ' open'}><summary>Backlog: ${plural(backlog, 'open item', 'open items')} from earlier</summary>${earlier.map((w) => `<h3>${esc(w.title)}</h3><ul class="checks">${w.items.filter((x) => !x.done).map(item).join('')}</ul>`).join('')}</details>` : ''}
      ${later.length ? `<details><summary>Coming up</summary>${later.map((w) => `<h3>${esc(w.title)}${w.hours ? ', ' + esc(w.hours) : ''}</h3><ul class="checks">${w.items.map(item).join('')}</ul>`).join('')}</details>` : ''}`;

    // bosses
    const bosses = !city.bosses.length ? '<p class="muted">No bosses. Add a file to the bosses folder.</p>'
      : city.bosses.map((b) => `<button class="boss${b.hp === 0 ? ' down' : ''}" data-boss="${esc(b.id)}">
          <span class="boss-name">${esc(b.name)}<span>${b.hp === 0 ? 'Defeated' : 'HP ' + b.hp + '%'}</span></span>
          <span class="boss-tag">${esc(b.tagline)}</span>
          <span class="hp"><i style="width:${b.hp}%"></i></span></button>`).join('');

    // damage
    const hits = [
      ...cards.flatMap((c) => c.missed.filter((m) => !m.resolved).map((m) => ({ who: c.name, attr: `data-card="${esc(c.id)}"`, text: m.text }))),
      ...city.bosses.flatMap((b) => b.missed.filter((m) => !m.resolved).map((m) => ({ who: b.name, attr: `data-boss="${esc(b.id)}"`, text: m.text }))),
    ];
    const damage = hits.length ? hits.map((h) => `<button ${h.attr}><b>${esc(h.who)}</b>${esc(h.text)}</button>`).join('')
      : '<p class="muted">Nothing open. When a practice question beats you, add a line under Missed in that card.</p>';

    document.title = `${city.title} | Learning Codex`;
    app.innerHTML = `
      <h1>${esc(city.title)}</h1>
      ${city.subtitle ? `<p class="sub">${esc(city.subtitle)}</p>` : ''}
      <div class="skyline" role="group" aria-label="City skyline, one window per entry">${towers}</div>
      ${power === 0 ? '<p class="dark-note">Every window is dark. Write the Baseline on one card and run the build to light the first one.</p>' : ''}
      <dl class="strip">
        <div><dt>City power</dt><dd><span class="big">${power}%</span><small>${count(3)} owned, ${count(2)} scanned, ${count(1)} seen, ${count(0)} locked.</small></dd></div>
        <div><dt>Time left</dt><dd>${deadline}</dd></div>
        <div><dt>Access keys</dt><dd>${keyHtml}</dd></div>
        <div><dt>Sync rate</dt><dd>${sync}</dd></div>
      </dl>
      <div class="cols">
        <main>
          <p class="legend">The three bars are Baseline, Isolate and Execute. Diamonds show the depth the exam needs, from 1 to 4; a tilde marks an estimate instead of the trainer's sheet. A red edge means an unresolved missed question.</p>
          ${districts}
        </main>
        <aside>
          <section><h2>This week</h2>${quests}</section>
          <section><h2>Bosses</h2>${bosses}</section>
          <section class="damage"><h2>Damage log</h2>${damage}</section>
        </aside>
      </div>`;
  }

  app.addEventListener('click', (e) => {
    const c = e.target.closest('[data-card]');
    if (c) return openCard(c.dataset.card);
    const b = e.target.closest('[data-boss]');
    if (b) openBoss(b.dataset.boss);
  });

  render();
})();
</script>
</body>
</html>
