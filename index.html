<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Codex</title>
<style>
  :root {
    --night: #120e26;
    --block: #1c1638;
    --block-2: #251d4a;
    --line: #3a2f6b;
    --ink: #ece7ff;
    --dim: #9a8fc7;
    --cyan: #45e0f0;
    --amber: #ffb547;
    --pink: #ff4d94;
    --red: #ff5a4a;
    --display: "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  body { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 96px; }

  /* masthead */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 0; color: var(--dim); font-size: 0.875rem; }
  .top select { font: inherit; color: var(--ink); background: var(--block); border: 1px solid var(--line); padding: 6px 10px; }
  h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(2.75rem, 8.5vw, 6.5rem); line-height: 0.9; letter-spacing: 0.01em; margin: 28px 0 0; }
  .sub { color: var(--dim); margin: 10px 0 0; }

  /* skyline */
  .skyline { margin-top: 40px; padding: 48px 0 0; display: flex; align-items: flex-end; overflow-x: auto; background: linear-gradient(to top, rgba(255, 77, 148, 0.13), rgba(255, 77, 148, 0) 62%) top / 100% calc(100% - 58px) no-repeat; }
  .plot { flex: 0 0 auto; display: flex; flex-direction: column; }
  .plot:last-child { flex: 1 0 auto; }
  .tower { align-self: flex-start; position: relative; margin: 0 18px 0 4px; background: var(--block); border: 1px solid var(--line); border-bottom: 0; padding: 12px 11px 10px; }
  .plot:nth-child(3n+1) .tower::before { content: ""; position: absolute; left: 18px; bottom: 100%; width: 2px; height: 22px; background: var(--line); }
  .plot:nth-child(4n+2) .tower::before { content: ""; position: absolute; right: 14px; bottom: 100%; width: 16px; height: 9px; border: 1px solid var(--line); border-bottom: 0; }
  .windows { display: flex; flex-wrap: wrap-reverse; gap: 6px; width: 74px; }
  .win { width: 14px; height: 18px; background: var(--block-2); border: 1px solid var(--line); }
  .win.l1 { background: rgba(69, 224, 240, 0.28); border-color: var(--cyan); }
  .win.l2 { background: rgba(255, 181, 71, 0.7); border-color: var(--amber); }
  .win.l3 { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 10px rgba(255, 77, 148, 0.75); }
  .win.breached { border-color: var(--red); box-shadow: inset 0 3px 0 var(--red); }
  .win:hover { border-color: var(--ink); }
  .plot-label { height: 58px; border-top: 1px solid var(--line); padding: 10px 14px 0 4px; font-size: 0.8125rem; line-height: 1.3; color: var(--dim); white-space: nowrap; }
  .plot-label b { display: block; color: var(--ink); font-weight: 600; }
  .dark-note { color: var(--dim); margin: 20px 0 0; max-width: 60ch; }
  @media (prefers-reduced-motion: no-preference) {
    .win.lit { animation: power-on 0.5s ease-out backwards; }
    @keyframes power-on { from { background: var(--block-2); border-color: var(--line); box-shadow: none; } }
  }

  /* status strip */
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 36px 0 0; border: 1px solid var(--line); }
  .strip > div { padding: 16px 18px; border-left: 1px solid var(--line); }
  .strip > div:first-child { border-left: 0; }
  .strip dt { color: var(--dim); font-size: 0.8125rem; }
  .strip dd { margin: 4px 0 0; }
  .strip .big { font-family: var(--display); font-size: 2.25rem; line-height: 1; display: block; }
  .strip small { color: var(--dim); font-size: 0.8125rem; display: block; margin-top: 6px; }
  .keys { display: flex; gap: 5px; margin-top: 8px; }
  .keys i { width: 16px; height: 9px; border: 1px solid var(--dim); }
  .keys i.req { border-color: var(--amber); }
  .keys i.on { background: var(--cyan); border-color: var(--cyan); }
  .keys i.req.on { background: var(--amber); border-color: var(--amber); }

  /* body grid */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; margin-top: 48px; align-items: start; }
  h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 1.75rem; line-height: 1; letter-spacing: 0.02em; margin: 0; }
  .legend { color: var(--dim); font-size: 0.875rem; max-width: 68ch; margin: 0 0 28px; }

  .district { margin-bottom: 40px; }
  .district-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .district-head span { color: var(--dim); font-size: 0.875rem; white-space: nowrap; }
  .meter { display: flex; height: 3px; background: var(--block-2); margin: 10px 0 6px; }
  .meter i { display: block; }
  .meter .m3 { background: var(--pink); } .meter .m2 { background: var(--amber); } .meter .m1 { background: var(--cyan); }

  .entry { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 62px; align-items: center; gap: 14px; width: 100%; padding: 9px 8px; border-bottom: 1px solid rgba(58, 47, 107, 0.6); }
  .entry:hover { background: var(--block); }
  .entry.l0 .entry-name { color: var(--dim); }
  .entry.breached { box-shadow: inset 3px 0 0 var(--red); }
  .bie { display: flex; gap: 3px; }
  .bie i { width: 8px; height: 16px; background: var(--block-2); border: 1px solid var(--line); }
  .bie i.b.on { background: var(--cyan); border-color: var(--cyan); }
  .bie i.i.on { background: var(--amber); border-color: var(--amber); }
  .bie i.e.on { background: var(--pink); border-color: var(--pink); }
  .entry-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-id { display: block; font-family: var(--mono); font-size: 0.75rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-lives { font-size: 0.8125rem; color: var(--dim); white-space: nowrap; }
  .pips { display: flex; gap: 5px; align-items: center; color: var(--dim); font-size: 0.8125rem; }
  .pips i { width: 6px; height: 6px; transform: rotate(45deg); border: 1px solid var(--dim); }
  .pips i.on { background: var(--ink); border-color: var(--ink); }

  /* side column */
  aside section { margin-bottom: 40px; }
  aside h2 { margin-bottom: 14px; }
  .muted { color: var(--dim); font-size: 0.875rem; }
  ul.checks { list-style: none; margin: 0; padding: 0; }
  ul.checks li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 5px 0; font-size: 0.9375rem; }
  .box { width: 13px; height: 13px; border: 1px solid var(--dim); margin-top: 5px; display: inline-block; flex: none; }
  .box.on { background: var(--cyan); border-color: var(--cyan); }
  li.done { color: var(--dim); text-decoration: line-through; }
  .tag { font-size: 0.75rem; border: 1px solid var(--cyan); color: var(--cyan); padding: 0 5px; margin-left: 6px; white-space: nowrap; text-decoration: none; display: inline-block; }
  .tag.req { border-color: var(--amber); color: var(--amber); }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details summary { cursor: pointer; color: var(--dim); font-size: 0.875rem; }
  details h3 { font-size: 0.875rem; font-weight: 600; margin: 14px 0 2px; }

  .boss { display: block; width: 100%; padding: 12px 0; border-top: 1px solid var(--line); }
  .boss:hover .boss-name { color: var(--pink); }
  .boss-name { font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
  .boss-name span { font-weight: 400; color: var(--dim); font-size: 0.8125rem; white-space: nowrap; }
  .boss-tag { color: var(--dim); font-size: 0.8125rem; display: block; }
  .hp { height: 6px; background: var(--block-2); margin-top: 8px; }
  .hp i { display: block; height: 100%; background: var(--red); }
  .boss.down .boss-name { text-decoration: line-through; color: var(--dim); }

  .damage button { display: block; width: 100%; padding: 8px 0 8px 12px; border-left: 3px solid var(--red); margin-bottom: 8px; font-size: 0.9375rem; }
  .damage button b { display: block; font-weight: 600; }
  .damage button:hover { background: var(--block); }

  /* entry sheet */
  dialog { margin: 0 0 0 auto; height: 100dvh; max-height: none; width: min(600px, 100vw); max-width: none; border: 0; border-left: 1px solid var(--line); background: var(--block); color: var(--ink); padding: 0; }
  dialog::backdrop { background: rgba(8, 5, 20, 0.72); }
  .sheet { padding: 28px 32px 64px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .sheet h2 { font-size: 2.5rem; }
  .close { border: 1px solid var(--line); padding: 6px 12px; font-size: 0.875rem; flex: none; }
  .close:hover { border-color: var(--ink); }
  .state { margin: 14px 0 0; font-size: 0.9375rem; }
  .state b.l0 { color: var(--dim); } .state b.l1 { color: var(--cyan); } .state b.l2 { color: var(--amber); } .state b.l3 { color: var(--pink); }
  .state .br { color: var(--red); }
  .path { font-family: var(--mono); font-size: 0.8125rem; color: var(--dim); background: var(--night); padding: 8px 10px; margin: 14px 0 0; overflow-x: auto; white-space: nowrap; }
  .note { margin-top: 24px; max-width: 62ch; }
  .note h3 { font-family: var(--display); text-transform: uppercase; font-size: 1.375rem; letter-spacing: 0.02em; margin: 28px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .note h4, .note h5 { font-size: 1rem; margin: 18px 0 6px; }
  .note p { margin: 0 0 10px; }
  .note .prompt { color: var(--dim); }
  .note ul { margin: 0 0 10px; padding-left: 20px; }
  .note li { margin-bottom: 4px; }
  .note li:has(.box) { list-style: none; margin-left: -20px; display: grid; grid-template-columns: 16px 1fr; gap: 10px; }
  .note pre { background: var(--night); padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.55; margin: 0 0 12px; }
  .note code { font-family: var(--mono); font-size: 0.875em; background: var(--night); padding: 1px 5px; }
  .note pre code { background: none; padding: 0; font-size: inherit; }
  .note img { max-width: 100%; display: block; margin: 8px 0 12px; border: 1px solid var(--line); }
  .note a { color: var(--cyan); }
  .note table { border-collapse: collapse; margin: 0 0 12px; font-size: 0.9375rem; }
  .note th, .note td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .note th { color: var(--dim); font-weight: 600; }

  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; gap: 24px; }
    .strip { grid-template-columns: 1fr 1fr; }
    .strip > div:nth-child(3) { border-left: 0; }
    .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px 64px; }
    .strip { grid-template-columns: 1fr; }
    .strip > div { border-left: 0; border-top: 1px solid var(--line); }
    .strip > div:first-child { border-top: 0; }
    .entry { grid-template-columns: 34px minmax(0, 1fr) 62px; }
    .entry-lives { display: none; }
    .sheet { padding: 20px 18px 48px; }
  }
</style>
</head>

  <div id="app"></div>
</div>

<script id="codex-data" type="application/json">{"cities":[{"id":"gcp-pca","title":"Professional Cloud Architect","subtitle":"Google Cloud","milestones":[{"label":"Cohort sessions end","date":"2026-12-08"},{"label":"Voucher form closes","date":"2026-12-29"},{"label":"Last day to sit the exam","date":"2027-01-20"}],"keysNeeded":5,"targetAccuracy":85,"districts":[{"id":"core","name":"Foundation"},{"id":"compute","name":"Compute"},{"id":"network","name":"Network"},{"id":"data","name":"Data"},{"id":"security","name":"Security"},{"id":"ops","name":"Operations"},{"id":"delivery","name":"Delivery"},{"id":"migrate","name":"Migration"},{"id":"ai","name":"AI"}],"cards":[{"id":"ai-agents-adk","name":"AI agents and the Agent Development Kit","district":"ai","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ai-gemini-models","name":"Gemini models on Vertex AI","district":"ai","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's family of multimodal generative AI models (text, images, audio, video, code), used through Vertex AI. An LLM is pre-trained on a huge dataset, then can be tuned for a purpose with a much smaller one.\n- Prompt types: zero-shot, one-shot, few-shot, role. Few-shot with output examples forces a structure such as custom JSON.\n- Good prompts: clear, concise, direct, with a persona and constraints.\n- Hallucinations (confident wrong output) come from missing context, too little data or dirty data. Reduce with grounding (Google Search or your own data), constraints and curated data.\nLike what I know:\n\n## Isolate\nPick it when: Generating or understanding content (summarize, classify, extract, chat, code) with a managed foundation model instead of training your own.\nNot it when (use a custom model on Vertex AI instead): A narrow prediction on your own structured data (fraud score, demand forecast) where classic ML fits better.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ai-vertex-ai","name":"Vertex AI","district":"ai","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-app-engine","name":"App Engine","district":"compute","threat":2,"estimate":false,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: PaaS for web apps and APIs: deploy code, Google runs and scales it.\n- Standard environment: sandboxed runtimes, scales to zero.\n- Flexible environment: runs on VMs, more runtime freedom, doesn't scale to zero.\n- One App Engine app per project, and its region is fixed at creation.\nLike what I know:\n\n## Isolate\nPick it when: An existing App Engine app, or a case study that already runs on it.\nNot it when (use Cloud Run instead): It's a new serverless web app. Google now points most new work to Cloud Run.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-cloud-functions","name":"Cloud Run functions (Cloud Functions)","district":"compute","threat":2,"estimate":false,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Single-purpose functions that run on an event. You write only the function; Google builds it and runs it on Cloud Run. (Formerly Cloud Functions.)\n- Triggers: HTTP (synchronous), or events from Cloud Storage, Pub/Sub and others through Eventarc (asynchronous).\n- Billed only while running; scales to zero. Integrated with Cloud Logging and Monitoring.\nLike what I know: AWS Lambda.\n\n## Isolate\nPick it when: Small event-driven glue code: resize an image when it lands in a bucket, react to a Pub/Sub message, connect Cloud services.\nNot it when (use Cloud Run instead): It's a full app or service with many routes, a custom container, or more than one job.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-cloud-run","name":"Cloud Run","district":"compute","threat":2,"estimate":false,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Serverless containers, built on Knative. Deploy a container image from Artifact Registry, or source code (Buildpacks builds it), and get an HTTPS URL. Scales out with requests and back to zero.\n- Pay for CPU and memory while handling requests (to the 100 ms), plus a fee per million requests. Bigger containers cost more. Minimum instances avoid cold starts.\n- Containers must be stateless. Services answer requests; jobs run tasks to completion.\n- Regional. For multi-region, put several behind a global Application Load Balancer.\nLike what I know:\n\n## Isolate\nPick it when: Stateless web apps, APIs or microservices in containers that should scale automatically, including to zero, with no infrastructure to manage.\nNot it when (use GKE instead): You need Kubernetes features or node-level control. For a single event handler, use Cloud Run functions.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-engine","name":"Compute Engine","district":"compute","threat":3,"estimate":false,"livesAt":"zonal","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: IaaS virtual machines. You pick machine type, OS image, disks and network; you manage the OS and everything on it.\n- Machine families: general-purpose, compute-optimized, memory-optimized, accelerator (GPUs). Custom machine types when presets don't fit.\n- Per-second billing (1-minute minimum). Sustained-use discounts apply automatically on some machine series; committed-use discounts (1 or 3 years) for steady workloads.\n- A VM lives in one zone. For high availability, use managed instance groups across zones.\nLike what I know:\n\n## Isolate\nPick it when: You need full OS control: lift-and-shift, specific OS or licensing, legacy software, GPUs, or software that won't containerize.\nNot it when (use GKE or Cloud Run instead): The app is containerized and you'd rather not manage VMs and OS patching.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-gke","name":"Google Kubernetes Engine","district":"compute","threat":3,"estimate":true,"livesAt":"zonal or regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google-managed Kubernetes. GKE runs the control plane; nodes are Compute Engine VMs. Sits between PaaS automation and IaaS control.\n- Pod: the smallest deployable unit. One or more containers that share network and storage and are deployed together.\n- Declarative: describe the desired state (5 replicas) in config, kubectl apply, Kubernetes makes it so.\n- Autopilot (recommended): Google manages nodes, scaling, upgrades and security; you pay for what pods request. Standard: you manage node pools and pay per node.\n- Zonal cluster: control plane in one zone. Regional cluster: control plane and nodes replicated across zones.\n- Built in: node auto-repair, auto-upgrade, cluster autoscaler, Cloud Logging and Monitoring.\nLike what I know:\n\n## Isolate\nPick it when: Many containerized services that need Kubernetes features: custom networking, stateful workloads, sidecars, or portability to other Kubernetes environments (hybrid, multicloud).\nNot it when (use Cloud Run instead): Stateless containers serving HTTP requests, where you don't need Kubernetes control.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-gpus","name":"Cloud GPUs","district":"compute","threat":1,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-instance-groups","name":"Managed instance groups","district":"compute","threat":2,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-local-ssd","name":"Local SSD","district":"compute","threat":1,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-persistent-disk","name":"Persistent Disk","district":"compute","threat":3,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-sole-tenant-nodes","name":"Sole-tenant nodes","district":"compute","threat":2,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-spot-vms","name":"Spot and preemptible VMs","district":"compute","threat":2,"estimate":false,"livesAt":"zonal","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Spare Compute Engine capacity at a 60 to 91% discount. Google can stop them at any time with 30 seconds' notice. No maximum runtime (the older preemptible VMs stopped after 24 hours).\n- No SLA; availability varies.\n- Pair with a managed instance group so they're recreated when capacity returns.\nLike what I know:\n\n## Isolate\nPick it when: The work can be interrupted and restarted: batch processing, rendering, CI jobs, data crunching.\nNot it when (use standard VMs with committed-use discounts instead): The workload must stay up (web servers, databases) but you still want savings on steady usage.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-billing-cost","name":"Billing and cost controls","district":"core","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-cloud-identity","name":"Cloud Identity","district":"core","threat":2,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's identity service for users and groups who aren't on Google Workspace, managed in the Google Admin console. Setting it up for a domain is what gives a company its organization node.\n- Sync users from Active Directory or LDAP with Google Cloud Directory Sync, or keep an existing identity provider (Entra ID, Okta) for single sign-on via SAML.\n- Free and Premium editions.\nLike what I know:\n\n## Isolate\nPick it when: The company needs managed Google identities for staff, especially when they already run Active Directory or their own SSO.\nNot it when (use Google Workspace instead): They also need Gmail, Docs and Drive. Workspace includes the same identity features.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-iam","name":"IAM roles and policies","district":"core","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Who (principal) can do what (role) on which resource. Roles are bundles of permissions, granted in allow policies at any level of the hierarchy and inherited downward. Deny policies block specific permissions regardless of what's granted.\n- Principals: Google accounts, groups, service accounts, Cloud Identity domains. Grant to groups, not individuals.\n- Basic: Owner, Editor, Viewer (now \"legacy basic\"; newer basic roles are Admin, Writer, Reader). Thousands of permissions; avoid in production.\n- Predefined: per-service roles from Google, e.g. roles/storage.objectViewer.\n- Custom: your own permission set, project or org level only, and you maintain it.\n- Allow policies only add on the way down: a child can't remove a role granted above. Use a deny policy for that.\nLike what I know:\n\n## Isolate\nPick it when: A predefined role covers the job. That's Google's default recommendation for least privilege.\nNot it when (use a custom role instead): Even the narrowest predefined role grants more than the job needs.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-org-policy","name":"Organization Policy","district":"core","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-regions-zones","name":"Regions and zones","district":"core","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Where resources physically run. A region is a geographic area (us-central1) made up of zones (us-central1-a). Every resource is zonal, regional or global, and that scope decides what one failure can take down.\n- Several zones in one region: survives a zone failure, with low latency between parts.\n- Several regions: closer to users worldwide, and survives a whole-region outage.\n- Region choice also answers data residency and compliance requirements.\nLike what I know:\n\n## Isolate\nPick it when: Surviving a zone failure is enough: spread across zones in one region (regional MIGs, regional GKE, Cloud SQL HA).\nNot it when (use multiple regions instead): The scenario mentions region-wide outages, disaster recovery, or users on several continents.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-resource-hierarchy","name":"Resource hierarchy","district":"core","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: The tree every resource sits in: organization node, then folders (optional, nestable), then projects, then resources. IAM and org policies set at any level flow down to everything below.\n- Project: the base unit for billing, enabling APIs and quotas. Project ID is globally unique and can't change after creation.\n- Folders group projects by team, department or environment.\n- Organization node: the top, tied to a Cloud Identity or Workspace domain. Holds org-wide roles like Organization Admin.\nLike what I know:\n\n## Isolate\nPick it when: Separating teams or environments (dev and prod in separate projects, grouped in folders) and applying one policy to many projects at once.\nNot it when (use labels instead): You only need to tag resources for cost reports or filtering. Labels don't change access.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-service-accounts","name":"Service accounts","district":"core","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: An identity for a workload (VM, app, pipeline) instead of a person, so it can call Google APIs, e.g. a VM reading a Cloud Storage bucket. Identified by an email address and given roles through IAM like any principal.\n- It's also a resource: you control who can use or impersonate it (Service Account User role).\n- Attach it to the VM or Cloud Run service and Google handles short-lived credentials. Downloaded keys are a security risk to avoid.\n- Prefer one dedicated service account per app with only the roles it needs over the default Compute Engine one.\nLike what I know:\n\n## Isolate\nPick it when: Code or a machine needs to call Google Cloud APIs without a person signed in.\nNot it when (use Workload Identity Federation instead): The workload runs outside Google Cloud (on-prem, AWS, GitHub Actions). Federate its existing identity instead of exporting a key.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-bigquery","name":"BigQuery","district":"data","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-bigtable","name":"Bigtable","district":"data","threat":2,"estimate":true,"livesAt":"zonal clusters, replicable across regions","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's wide-column NoSQL database for huge workloads at consistent low latency and high throughput (powers Search, Maps, Gmail). Built for fast lookups and scans by row key, not relational queries. HBase-compatible.\n- Scale by adding nodes; throughput grows with them.\n- Row key design decides performance.\n- Fed by streaming (Dataflow, Spark) or batch (Dataflow, Hadoop, Spark).\nLike what I know:\n\n## Isolate\nPick it when: More than 1 TB with heavy, low-latency reads and writes: IoT and sensor time series, financial ticks, ad tech, user analytics serving, or moving off HBase.\nNot it when (use BigQuery instead): You need SQL analytics across the whole dataset rather than fast key lookups. For small app data, Firestore.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-cloud-sql","name":"Cloud SQL","district":"data","threat":3,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Fully managed relational database: MySQL, PostgreSQL, SQL Server. Google handles patches, backups, replication and failover.\n- High availability: a standby in another zone of the same region, automatic failover.\n- Read replicas, including cross-region, for scaling reads and disaster recovery.\n- Scales up (bigger machine), not out: writes go to one primary.\nLike what I know:\n\n## Isolate\nPick it when: A standard relational workload (web app, CRM, ERP), often a lift-and-shift of an existing MySQL, PostgreSQL or SQL Server database.\nNot it when (use Spanner instead): It needs horizontal write scaling, global strong consistency or 99.999% availability.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-cloud-storage","name":"Cloud Storage","district":"data","threat":3,"estimate":true,"livesAt":"region, dual-region or multi-region","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Object storage (objects, not files and folders or disk blocks) for unstructured data. 11 nines durability. Buckets need a globally unique name and a location: region, dual-region or multi-region, picked near users.\n- Classes by how often data is read: Standard (hot), Nearline (about monthly, 30-day minimum), Coldline (at most every 90 days, 90-day minimum), Archive (under once a year, 365-day minimum). Colder means cheaper storage, pricier retrieval, same millisecond access.\n- Objects are immutable. Versioning keeps old versions; without it, changes overwrite.\n- Access: IAM inherited project to bucket to object; ACLs where needed. Encrypted at rest and in transit by default.\n- Lifecycle rules change class or delete by age. Autoclass moves objects between classes by access pattern.\nLike what I know:\n\n## Isolate\nPick it when: Unstructured objects of any size: media, backups, archives, data lake files, static website assets.\nNot it when (use Filestore or Persistent Disk instead): The app needs a mounted file system (Filestore, NFS) or a block disk for a VM (Persistent Disk).\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-dataflow","name":"Dataflow","district":"data","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-filestore","name":"Filestore","district":"data","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-firestore","name":"Firestore","district":"data","threat":2,"estimate":true,"livesAt":"regional or multi-region","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Serverless NoSQL document database for mobile, web and server apps. Documents grouped in collections, flexible schema, scales automatically, strongly consistent.\n- Real-time listeners and offline sync for client apps.\n- Pay per read, write and delete, plus storage.\nLike what I know:\n\n## Isolate\nPick it when: App data with a flexible schema (user profiles, game state, product catalogs), especially mobile or web apps that need real-time sync.\nNot it when (use Bigtable instead): Massive throughput or time-series data at terabyte-to-petabyte scale. For relational data, Cloud SQL.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-memorystore","name":"Memorystore","district":"data","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-pubsub","name":"Pub/Sub","district":"data","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-spanner","name":"Spanner","district":"data","threat":2,"estimate":true,"livesAt":"regional or multi-region","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Fully managed relational database that scales horizontally, stays strongly consistent and speaks SQL. Up to 99.999% availability on multi-region configurations (99.99% regional).\n- Joins, secondary indexes and ACID transactions at global scale.\n- Capacity is set in nodes or processing units; add more to scale reads and writes.\nLike what I know:\n\n## Isolate\nPick it when: Relational data that outgrows one machine: high write throughput, global users, strong consistency, five nines (global inventory, finance, gaming).\nNot it when (use Cloud SQL instead): A single-region relational database fits. It's cheaper, simpler and works with existing MySQL or PostgreSQL apps.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-transfer","name":"Storage Transfer Service and Transfer Appliance","district":"data","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Two ways to move large amounts of data into Google Cloud.\n- Storage Transfer Service: managed, schedulable transfers over the network into Cloud Storage, from other clouds (S3, Azure), HTTP sources, other buckets, or on-prem file systems through agents.\n- Transfer Appliance: a rackable, high-capacity storage server Google ships to you. You load it and ship it back.\nLike what I know:\n\n## Isolate\nPick it when: The data is reachable online and the network can move it in reasonable time: Storage Transfer Service.\nNot it when (use Transfer Appliance instead): Hundreds of terabytes or more over limited bandwidth, where a network transfer would take weeks.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"delivery-apigee","name":"Apigee and API Gateway","district":"delivery","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"delivery-application-integration","name":"Application Integration","district":"delivery","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"delivery-artifact-registry","name":"Artifact Registry","district":"delivery","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"delivery-cloud-build","name":"Cloud Build","district":"delivery","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"delivery-cloud-deploy","name":"Cloud Deploy","district":"delivery","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"delivery-terraform","name":"Terraform on Google Cloud","district":"delivery","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"migrate-bare-metal","name":"Bare Metal Solution","district":"migrate","threat":1,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"migrate-migration-center","name":"Migration Center","district":"migrate","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"migrate-to-vms","name":"Migrate to Virtual Machines","district":"migrate","threat":1,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"migrate-vmware-engine","name":"Google Cloud VMware Engine","district":"migrate","threat":1,"estimate":false,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-cloud-armor","name":"Cloud Armor","district":"network","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-cloud-cdn","name":"Cloud CDN","district":"network","threat":2,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Caches content at Google's edge locations, close to users. Lower latency, less load on origins, lower egress costs. Turned on per backend of an external Application Load Balancer (a checkbox).\n- Origins: instance groups, Cloud Storage buckets, network endpoint groups.\n- Control with cache headers and TTLs; signed URLs for private content.\nLike what I know:\n\n## Isolate\nPick it when: Static or cacheable content (images, JS/CSS, downloads) for users in many places, served through an Application Load Balancer.\nNot it when (use Media CDN instead): Large-scale video streaming and very large downloads. Media CDN is built for that.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-cloud-dns","name":"Cloud DNS","district":"network","threat":1,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's managed DNS, on the same infrastructure as Google: low latency, 100% availability SLA.\n- Public zones answer the internet; private zones are visible only inside the VPCs you choose.\n- DNS forwarding and peering resolve names between on-prem and Google Cloud.\nLike what I know:\n\n## Isolate\nPick it when: Hosting your domain's DNS records in Google Cloud, or internal names for VMs and services in a VPC.\nNot it when (use a domain registrar instead): You need to buy or register the domain itself. Cloud DNS only serves the records.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-cloud-nat","name":"Cloud NAT","district":"network","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-firewall","name":"Firewall rules and policies","district":"network","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-hybrid-connectivity","name":"Cloud VPN and Interconnect","district":"network","threat":3,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Ways to connect a VPC to on-prem or another cloud.\n- Cloud VPN: IPsec tunnels over the internet, encrypted, through Cloud Router. HA VPN has a 99.99% SLA. Limited by internet bandwidth.\n- Dedicated Interconnect: private physical connections to Google at a colocation facility. 99.99% SLA needs four connections across two regions; 99.9% needs two in one metro; one connection has no SLA.\n- Partner Interconnect: the same idea through a service provider, 50 Mbps to 50 Gbps. Up to 99.99%, but Google only covers its side.\n- Cross-Cloud Interconnect: dedicated link to another cloud provider, for multicloud.\n- Interconnect traffic isn't encrypted by default. Add MACsec or HA VPN over Interconnect if required.\n- Direct and Carrier Peering reach Google's public services (Workspace, APIs), not your VPC. No SLA.\nLike what I know:\n\n## Isolate\nPick it when: Mission-critical, high-bandwidth private link, and you can reach a Google colocation facility: Dedicated Interconnect.\nNot it when (use Partner Interconnect or Cloud VPN instead): You can't reach a colocation facility or need less bandwidth (Partner). Cheap, quick and encrypted over the internet (HA VPN).\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-load-balancing","name":"Cloud Load Balancing","district":"network","threat":3,"estimate":true,"livesAt":"global or regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Managed, software-defined load balancing; no VMs to run. Health checks, autoscaling, and one anycast IP with multi-region failover for global load balancers.\n- Application LB: layer 7, HTTP(S). Proxy, TLS termination, URL and host-based routing. Works with Cloud CDN, Cloud Armor and IAP. External or internal, global or regional.\n- Network LB, proxy: layer 4 TCP (optional SSL offload); terminates connections.\n- Network LB, passthrough: layer 4 TCP/UDP; doesn't terminate connections and keeps the client's IP. Regional.\n- Backends: instance groups, or network endpoint groups for GKE, Cloud Run and other serverless.\nLike what I know:\n\n## Isolate\nPick it when: HTTP(S) apps, content-based routing, TLS termination, global users: Application LB.\nNot it when (use a Network LB instead): Non-HTTP traffic (TCP/UDP), or the backend needs the client's IP or must terminate TLS itself (passthrough).\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-private-access","name":"Private Google Access and Private Service Connect","district":"network","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-shared-vpc-peering","name":"Shared VPC and VPC peering","district":"network","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Two ways to connect networks across projects.\n- Shared VPC: a host project owns the VPC; service projects in the same organization put resources in its subnets. Network admins keep central control; app teams manage their own resources.\n- VPC Network Peering: links two separate VPCs (different projects or even organizations) over internal IPs. Each side stays independently managed. Not transitive: A-B and B-C doesn't give A-C. IP ranges can't overlap.\nLike what I know:\n\n## Isolate\nPick it when: One organization wants central control of the network across many projects: Shared VPC.\nNot it when (use VPC Network Peering instead): Connecting networks owned by different teams or organizations that should stay independently managed.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"network-vpc","name":"VPC networks and subnets","district":"network","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Your private, software-defined network in Google Cloud. The VPC is global; subnets are regional and span all zones in their region, so one subnet can hold VMs in several zones.\n- Auto mode: one subnet per region made for you. Custom mode: you choose subnets and ranges (recommended for production).\n- Routes and a distributed firewall are built in; no appliances to provision.\n- Subnet ranges can be expanded without downtime, not shrunk.\n- Firewall rules target VMs by network tag or service account.\n- VMs in one VPC reach each other across regions over internal IPs, no VPN needed.\nLike what I know:\n\n## Isolate\nPick it when: Every workload needs one. The design question is how many VPCs and which subnets.\nNot it when (use Shared VPC instead): Several projects or teams need one centrally managed network.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ops-disaster-recovery","name":"Disaster recovery: RTO and RPO","district":"ops","threat":3,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ops-logging","name":"Cloud Logging","district":"ops","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ops-monitoring","name":"Cloud Monitoring","district":"ops","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ops-sre-slos","name":"SLIs, SLOs and error budgets","district":"ops","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-command-center","name":"Security Command Center","district":"security","threat":1,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-iap","name":"Identity-Aware Proxy","district":"security","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-kms","name":"Cloud KMS and encryption keys","district":"security","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-secret-manager","name":"Secret Manager","district":"security","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-sensitive-data-protection","name":"Sensitive Data Protection (DLP)","district":"security","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"security-vpc-service-controls","name":"VPC Service Controls","district":"security","threat":2,"estimate":true,"livesAt":"","b":false,"i":false,"e":false,"level":0,"missed":[],"body":"\n## Baseline\nWhat it is:\nLike what I know:\n\n## Isolate\nPick it when:\nNot it when (use ___ instead):\n\n## Execute\nWhat I built:\n\n## Missed\n"}],"bosses":[{"id":"case-altostrat-media","name":"Altostrat Media","tagline":"Media and content management","parts":[{"title":"Company in one line","done":false},{"title":"Business requirements","done":false},{"title":"Technical requirements","done":false},{"title":"My architecture","done":false},{"title":"Service picks","done":false}],"hp":100,"missed":[],"body":"\n## Company in one line\n\u003c!-- Who they are and what they sell, in your words. -->\n\n## Business requirements\n\u003c!-- What the business wants. These decide the \"best\" answer when two options both work. -->\n\n## Technical requirements\n\u003c!-- What exists today and what the solution must do. -->\n\n## My architecture\n\u003c!-- Draw it as a Mermaid code block. GitHub renders it. -->\n\n## Service picks\n\u003c!-- One line each: service, and the requirement that made you pick it. -->\n\n## Missed\n"},{"id":"case-cymbal-retail","name":"Cymbal Retail","tagline":"Digital retail and integration","parts":[{"title":"Company in one line","done":false},{"title":"Business requirements","done":false},{"title":"Technical requirements","done":false},{"title":"My architecture","done":false},{"title":"Service picks","done":false}],"hp":100,"missed":[],"body":"\n## Company in one line\n\u003c!-- Who they are and what they sell, in your words. -->\n\n## Business requirements\n\u003c!-- What the business wants. These decide the \"best\" answer when two options both work. -->\n\n## Technical requirements\n\u003c!-- What exists today and what the solution must do. -->\n\n## My architecture\n\u003c!-- Draw it as a Mermaid code block. GitHub renders it. -->\n\n## Service picks\n\u003c!-- One line each: service, and the requirement that made you pick it. -->\n\n## Missed\n"},{"id":" e":false,"key":null},{"text":"Skim all four case studies","done":false,"key":null}]},{"title":"Week 1","start":"2026-11-03","hours":"~9h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":true,"key":null},{"text":"Course: Google Cloud Fundamentals: Core Infrastructure","done":true,"key":null},{"text":"Course: Essential Google Cloud Infrastructure: Core Services","done":false,"key":null},{"text":"Badge: Implement Load Balancing on Compute Engine","done":false,"key":"key"}]},{"title":"Week 2","start":"2026-11-10","hours":"~15h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":true,"key":null},{"text":"Course: Networking in Google Cloud: Fundamentals","done":false,"key":null},{"text":"Course: Elastic Google Cloud Infrastructure: Scaling and Automation","done":false,"key":null},{"text":"Badge: Set Up an App Dev Environment on Google Cloud","done":false,"key":"key"}]},{"title":"Week 3","start":"2026-11-17","hours":"~17h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":true,"key":null},{"text":"Course: Networking in Google Cloud: Network Architecture","done":false,"key":null},{"text":"Course: Managing Security in Google Cloud","done":false,"key":null},{"text":"Badge: Implement Cloud Security Fundamentals on Google Cloud","done":false,"key":"key"}]},{"title":"Week 4","start":"2026-11-24","hours":"~12h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":false,"key":null},{"text":"Course: Getting Started with Terraform for Google Cloud","done":false,"key":null},{"text":"Course: Reliable Google Cloud Infrastructure: Design and Process","done":false,"key":null},{"text":"Badge: Cloud Architecture: Design, Implement, and Manage","done":false,"key":"key"},{"text":"Apply for the exam voucher once five badges are done","done":false,"key":null}]},{"title":"Week 5","start":"2026-12-01","hours":"~12h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":false,"key":null},{"text":"Course: Manage Scalable Workloads in GKE","done":false,"key":null},{"text":"Badge: Manage Kubernetes in Google Cloud","done":false,"key":"key"},{"text":"Badge: Engineer AI Agents with Agent Development Kit (ADK)","done":false,"key":"required"}]},{"title":"Week 6","start":"2026-12-08","hours":"~14h","items":[{"text":"Attend the live session, Tuesday 13:00 to 14:30 Central","done":false,"key":null},{"text":"Course: Observability in Google Cloud","done":false,"key":null},{"text":"Course: Introduction to AI and Machine Learning on Google Cloud","done":false,"key":null},{"text":"Badge: Develop Serverless Applications on Cloud Run","done":false,"key":"key"},{"text":"Take the final exam-like quiz and log the score","done":false,"key":null},{"text":"Book the exam","done":false,"key":null}]},{"title":"Revision","start":"2026-12-15","hours":"until 20 Jan","items":[{"text":"Clear every breached entry","done":false,"key":null},{"text":"Defeat all four bosses","done":false,"key":null},{"text":"Reach 85% on a full practice run","done":false,"key":null},{"text":"Sit the exam","done":false,"key":null}]}],"quizzes":[]}]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('codex-data').textContent);
  const app = document.getElementById('app');
  const sheet = document.getElementById('sheet');
  const sheetBody = document.getElementById('sheet-body');
  const LEVELS = ['Locked', 'Seen', 'Scanned', 'Owned'];
  const DEPTH = ['', 'basics', 'medium', 'advanced', 'expert'];
  const PROMPT = /^\s*(What it is|Like what I know|Pick it when|Not it when[^:]*|What I built)\s*:/i;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const today = new Date();
  const daysUntil = (iso) => Math.ceil((new Date(iso + 'T23:59:59') - today) / 864e5);
  const niceDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const isBreached = (x) => x.missed.some((m) => !m.resolved);

  if (typeof DATA === 'string' || !DATA.cities || !DATA.cities.length) {
    app.innerHTML = '<h1>No city yet</h1><p class="sub">Create one with <code>node codex.mjs city my-topic "My topic"</code>, then run <code>node codex.mjs build</code>.</p>';
    return;
  }

  let city = DATA.cities[0];
  if (DATA.cities.length > 1) {
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'City');
    sel.innerHTML = DATA.cities.map((c, i) => `<option value="${i}">${esc(c.title)}</option>`).join('');
    sel.onchange = () => { city = DATA.cities[+sel.value]; render(); };
    document.getElementById('switch').append(sel);
  }

  // ---------- small Markdown renderer for the entry sheet ----------
  function inline(s, base) {
    return esc(s)
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => `<img alt="${alt}" src="${/^(https?:|data:|\/)/.test(src) ? src : base + '/' + src}">`)
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function md(src, base) {
    const lines = src.replace(/<!--[\s\S]*?-->/g, '').split(/\r?\n/);
    let html = '', code = null, list = false, para = [], table = [];
    const endP = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
    const endL = () => { if (list) { html += '</ul>'; list = false; } };
    const endT = () => {
      if (!table.length) return;
      const rows = table.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim(), base)));
      html += '<table>' + rows.map((r, i) => '<tr>' + r.map((c) => (i ? `<td>${c}</td>` : `<th>${c}</th>`)).join('') + '</tr>').join('') + '</table>';
      table = [];
    };
    const endAll = () => { endP(); endL(); endT(); };
    for (const line of lines) {
      if (line.trim().startsWith('```')) {
        if (code) { html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; code = null; }
        else { endAll(); code = []; }
        continue;
      }
      if (code) { code.push(line); continue; }
      const h = line.match(/^(#{2,4})\s+(.*)/);
      if (h) { endAll(); const n = h[1].length + 1; html += `<h${n}>${inline(h[2], base)}</h${n}>`; continue; }
      if (/^\s*\|/.test(line)) { endP(); endL(); table.push(line); continue; }
      const li = line.match(/^\s*[-*]\s+(?:\[( |x|X)\]\s+)?(.*)/);
      if (li) {
        endP(); endT();
        if (!list) { html += '<ul>'; list = true; }
        const box = li[1] === undefined ? '' : `<span class="box${li[1] === ' ' ? '' : ' on'}"></span>`;
        html += `<li>${box}<span>${inline(li[2], base)}</span></li>`;
        continue;
      }
      if (!line.trim()) { endAll(); continue; }
      endL(); endT();
      const p = line.match(PROMPT);
      if (p) {
        const rest = line.slice(p[0].length).trim();
        para.push(`<span class="prompt">${esc(p[0].trim())}</span> ${rest ? inline(rest, base) : '<span class="prompt">not written yet</span>'}`);
      } else para.push(inline(line, base));
    }
    if (code) html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>';
    endAll();
    return html;
  }

  // ---------- sheet ----------
  function openCard(id) {
    const c = city.cards.find((x) => x.id === id);
    if (!c) return;
    const next = c.level === 3 ? 'All three parts are written.'
      : !c.b ? 'Next: write Baseline to mark it Seen.'
      : !c.i ? 'Next: write Isolate to mark it Scanned.'
      : !c.e ? 'Next: build something and record it under Execute to own it.'
      : 'Write the earlier parts too; status goes in order.';
    const open = c.missed.filter((m) => !m.resolved).length;
    sheetBody.innerHTML = `
      <div class="sheet-top"><h2 id="sheet-title">${esc(c.name)}</h2><button class="close" data-close>Close</button></div>
      <p class="state"><b class="l${c.level}">${LEVELS[c.level]}</b>. ${next}
        ${open ? `<span class="br">Breached: ${plural(open, 'missed question', 'missed questions')} to resolve.</span>` : ''}</p>
      <p class="muted">Depth needed: ${DEPTH[c.threat]} (${c.threat} of 4${c.estimate ? ', estimate' : ', from the trainer sheet'}).
        ${c.livesAt ? 'Lives at: ' + esc(c.livesAt) + '.' : 'Lives at: not set yet (zonal, regional, multi-regional or global).'}</p>
      <p class="path">cities/${esc(city.id)}/cards/${esc(c.id)}.md</p>
      <div class="note">${md(c.body, `cities/${city.id}/cards`)}</div>`;
    sheet.showModal();
  }
  function openBoss(id) {
    const b = city.bosses.find((x) => x.id === id);
    if (!b) return;
    const done = b.parts.filter((p) => p.done).length;
    sheetBody.innerHTML = `
      <div class="sheet-top"><h2 id="sheet-title">${esc(b.name)}</h2><button class="close" data-close>Close</button></div>
      <p class="state">${b.hp === 0 ? 'Defeated.' : `HP ${b.hp}%. ${done} of ${b.parts.length} parts written.`}</p>
      <p class="path">cities/${esc(city.id)}/bosses/${esc(b.id)}.md</p>
      <div class="note">${md(b.body, `cities/${city.id}/bosses`) || '<p class="muted">Nothing written yet.</p>'}</div>`;
    sheet.showModal();
  }
  sheet.addEventListener('click', (e) => { if (e.target === sheet || e.target.closest('[data-close]')) sheet.close(); });

  // ---------- page ----------
  function render() {
    const cards = city.cards;
    const count = (l) => cards.filter((c) => c.level === l).length;
    const power = cards.length ? Math.round((100 * cards.reduce((s, c) => s + c.level, 0)) / (3 * cards.length)) : 0;
    const byDistrict = city.districts.map((d) => ({
      ...d,
      cards: cards.filter((c) => c.district === d.id).sort((a, b) => b.threat - a.threat || a.name.localeCompare(b.name)),
    })).filter((d) => d.cards.length);

    // skyline
    let n = 0;
    const towers = byDistrict.map((d) => `
      <div class="plot"><div class="tower"><div class="windows">${d.cards.map((c) => {
        const delay = c.level ? ` style="animation-delay:${(n++ * 35)}ms"` : '';
        const label = `${c.name}: ${LEVELS[c.level]}${isBreached(c) ? ', breached' : ''}`;
        return `<button class="win l${c.level}${c.level ? ' lit' : ''}${isBreached(c) ? ' breached' : ''}" data-card="${esc(c.id)}" title="${esc(label)}" aria-label="${esc(label)}"${delay}></button>`;
      }).join('')}</div></div>
      <div class="plot-label"><b>${esc(d.name)}</b>${d.cards.filter((c) => c.level === 3).length} of ${d.cards.length} owned</div></div>`).join('');

    // deadline
    const upcoming = city.milestones.filter((m) => daysUntil(m.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
    const last = city.milestones.length ? [...city.milestones].sort((a, b) => a.date.localeCompare(b.date)).pop() : null;
    const deadline = !last ? '<span class="big">No dates</span><small>Add milestones in city.json.</small>'
      : daysUntil(last.date) < 0 ? `<span class="big">Past</span><small>${esc(last.label)} was ${niceDate(last.date)}.</small>`
      : `<span class="big">${plural(daysUntil(last.date), 'day', 'days')}</span><small>${esc(last.label)}, ${niceDate(last.date)}.${upcoming[0] && upcoming[0] !== last ? ` Next: ${esc(upcoming[0].label.toLowerCase())} in ${plural(daysUntil(upcoming[0].date), 'day', 'days')}.` : ''}</small>`;

    // keys
    const keys = city.weeks.flatMap((w) => w.items.filter((i) => i.key));
    const keysDone = keys.filter((k) => k.done).length;
    const reqLeft = keys.filter((k) => k.key === 'required' && !k.done);
    const gateOpen = keys.length && keysDone >= city.keysNeeded && !reqLeft.length;
    const keyHtml = !keys.length ? '<span class="big">None</span><small>Tag a quest with {key} to track badges.</small>'
      : `<span class="big">${keysDone} of ${keys.length}</span>
         <div class="keys">${keys.map((k) => `<i class="${k.key === 'required' ? 'req ' : ''}${k.done ? 'on' : ''}" title="${esc(k.text)}"></i>`).join('')}</div>
         <small>${gateOpen ? 'Gate open. Apply for the voucher.' : `Gate opens at ${city.keysNeeded}${reqLeft.length ? ', and the amber key is required' : ''}.`}</small>`;

    // sync rate
    const qz = city.quizzes;
    const got = qz.reduce((s, q) => s + q.got, 0), total = qz.reduce((s, q) => s + q.total, 0);
    const lastQ = qz.length ? [...qz].sort((a, b) => a.date.localeCompare(b.date)).pop() : null;
    const sync = !qz.length ? `<span class="big">No data</span><small>Log a quiz in quizzes.md. Target ${city.targetAccuracy}%.</small>`
      : `<span class="big">${Math.round((100 * got) / total)}%</span><small>Across ${plural(qz.length, 'quiz', 'quizzes')}. Last: ${esc(lastQ.label)}, ${lastQ.got}/${lastQ.total}. Target ${city.targetAccuracy}%.</small>`;

    // entries
    const districts = byDistrict.map((d) => {
      const pct = (l) => (100 * d.cards.filter((c) => c.level === l).length) / d.cards.length;
      return `<section class="district">
        <div class="district-head"><h2>${esc(d.name)}</h2><span>${d.cards.filter((c) => c.level === 3).length} of ${d.cards.length} owned</span></div>
        <div class="meter"><i class="m3" style="width:${pct(3)}%"></i><i class="m2" style="width:${pct(2)}%"></i><i class="m1" style="width:${pct(1)}%"></i></div>
        ${d.cards.map((c) => `<button class="entry l${c.level}${isBreached(c) ? ' breached' : ''}" data-card="${esc(c.id)}">
          <span class="bie" title="Baseline, Isolate, Execute"><i class="b${c.b ? ' on' : ''}"></i><i class="i${c.i ? ' on' : ''}"></i><i class="e${c.e ? ' on' : ''}"></i></span>
          <span><span class="entry-name">${esc(c.name)}</span><span class="entry-id">${esc(c.id)}</span></span>
          <span class="entry-lives">${esc(c.livesAt)}</span>
          <span class="pips" title="Depth needed: ${DEPTH[c.threat]}${c.estimate ? ' (estimate)' : ' (trainer sheet)'}">${[1, 2, 3, 4].map((k) => `<i class="${k <= c.threat ? 'on' : ''}"></i>`).join('')}${c.estimate ? '<span>~</span>' : ''}</span>
        </button>`).join('')}
      </section>`;
    }).join('');

    // quests
    const dated = city.weeks.filter((w) => w.start);
    let current = null;
    for (const w of dated) if (new Date(w.start + 'T00:00:00') <= today) current = w;
    const idx = current ? city.weeks.indexOf(current) : -1;
    const earlier = city.weeks.filter((w, i) => (idx < 0 ? !w.start : i < idx) && w.items.some((x) => !x.done));
    const later = city.weeks.filter((w, i) => (idx < 0 ? !!w.start : i > idx));
    const item = (x) => `<li class="${x.done ? 'done' : ''}"><span class="box${x.done ? ' on' : ''}"></span><span>${esc(x.text)}${x.key ? `<span class="tag${x.key === 'required' ? ' req' : ''}">${x.key === 'required' ? 'required key' : 'key'}</span>` : ''}</span></li>`;
    const backlog = earlier.reduce((s, w) => s + w.items.filter((x) => !x.done).length, 0);
    const quests = !city.weeks.length ? '<p class="muted">No quests. Add weeks to quests.md.</p>' : `
      ${current ? `<p class="muted">${esc(current.title)}${current.hours ? ', ' + esc(current.hours) : ''}</p><ul class="checks">${current.items.map(item).join('')}</ul>` : '<p class="muted">Nothing has started yet.</p>'}
      ${backlog ? `<details${current ? '' : ' open'}><summary>Backlog: ${plural(backlog, 'open item', 'open items')} from earlier</summary>${earlier.map((w) => `<h3>${esc(w.title)}</h3><ul class="checks">${w.items.filter((x) => !x.done).map(item).join('')}</ul>`).join('')}</details>` : ''}
      ${later.length ? `<details><summary>Coming up</summary>${later.map((w) => `<h3>${esc(w.title)}${w.hours ? ', ' + esc(w.hours) : ''}</h3><ul class="checks">${w.items.map(item).join('')}</ul>`).join('')}</details>` : ''}`;

    // bosses
    const bosses = !city.bosses.length ? '<p class="muted">No bosses. Add a file to the bosses folder.</p>'
      : city.bosses.map((b) => `<button class="boss${b.hp === 0 ? ' down' : ''}" data-boss="${esc(b.id)}">
          <span class="boss-name">${esc(b.name)}<span>${b.hp === 0 ? 'Defeated' : 'HP ' + b.hp + '%'}</span></span>
          <span class="boss-tag">${esc(b.tagline)}</span>
          <span class="hp"><i style="width:${b.hp}%"></i></span></button>`).join('');

    // damage
    const hits = [
      ...cards.flatMap((c) => c.missed.filter((m) => !m.resolved).map((m) => ({ who: c.name, attr: `data-card="${esc(c.id)}"`, text: m.text }))),
      ...city.bosses.flatMap((b) => b.missed.filter((m) => !m.resolved).map((m) => ({ who: b.name, attr: `data-boss="${esc(b.id)}"`, text: m.text }))),
    ];
    const damage = hits.length ? hits.map((h) => `<button ${h.attr}><b>${esc(h.who)}</b>${esc(h.text)}</button>`).join('')
      : '<p class="muted">Nothing open. When a practice question beats you, add a line under Missed in that card.</p>';

    document.title = `${city.title} | Learning Codex`;
    app.innerHTML = `
      <h1>${esc(city.title)}</h1>
      ${city.subtitle ? `<p class="sub">${esc(city.subtitle)}</p>` : ''}
      <div class="skyline" role="group" aria-label="City skyline, one window per entry">${towers}</div>
      ${power === 0 ? '<p class="dark-note">Every window is dark. Write the Baseline on one card and run the build to light the first one.</p>' : ''}
      <dl class="strip">
        <div><dt>City power</dt><dd><span class="big">${power}%</span><small>${count(3)} owned, ${count(2)} scanned, ${count(1)} seen, ${count(0)} locked.</small></dd></div>
        <div><dt>Time left</dt><dd>${deadline}</dd></div>
        <div><dt>Access keys</dt><dd>${keyHtml}</dd></div>
        <div><dt>Sync rate</dt><dd>${sync}</dd></div>
      </dl>
      <div class="cols">
        <main>
          <p class="legend">The three bars are Baseline, Isolate and Execute. Diamonds show the depth the exam needs, from 1 to 4; a tilde marks an estimate instead of the trainer's sheet. A red edge means an unresolved missed question.</p>
          ${districts}
        </main>
        <aside>
          <section><h2>This week</h2>${quests}</section>
          <section><h2>Bosses</h2>${bosses}</section>
          <section class="damage"><h2>Damage log</h2>${damage}</section>
        </aside>
      </div>`;
  }

  app.addEventListener('click', (e) => {
    const c = e.target.closest('[data-card]');
    if (c) return openCard(c.dataset.card);
    const b = e.target.closest('[data-boss]');
    if (b) openBoss(b.dataset.boss);
  });

  render();
})();
</script>
</body>
</html>
