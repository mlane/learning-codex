<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Codex</title>
<style>
  :root {
    --night: #120e26;
    --block: #1c1638;
    --block-2: #251d4a;
    --line: #3a2f6b;
    --ink: #ece7ff;
    --dim: #9a8fc7;
    --cyan: #45e0f0;
    --amber: #ffb547;
    --pink: #ff4d94;
    --red: #ff5a4a;
    --display: "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  body { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 96px; }

  /* masthead */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 0; color: var(--dim); font-size: 0.875rem; }
  .top select { font: inherit; color: var(--ink); background: var(--block); border: 1px solid var(--line); padding: 6px 10px; }
  h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(2.75rem, 8.5vw, 6.5rem); line-height: 0.9; letter-spacing: 0.01em; margin: 28px 0 0; }
  .sub { color: var(--dim); margin: 10px 0 0; }

  /* skyline */
  .skyline { margin-top: 40px; padding: 48px 0 0; display: flex; align-items: flex-end; overflow-x: auto; background: linear-gradient(to top, rgba(255, 77, 148, 0.13), rgba(255, 77, 148, 0) 62%) top / 100% calc(100% - 58px) no-repeat; }
  .plot { flex: 0 0 auto; display: flex; flex-direction: column; }
  .plot:last-child { flex: 1 0 auto; }
  .tower { align-self: flex-start; position: relative; margin: 0 18px 0 4px; background: var(--block); border: 1px solid var(--line); border-bottom: 0; padding: 12px 11px 10px; }
  .plot:nth-child(3n+1) .tower::before { content: ""; position: absolute; left: 18px; bottom: 100%; width: 2px; height: 22px; background: var(--line); }
  .plot:nth-child(4n+2) .tower::before { content: ""; position: absolute; right: 14px; bottom: 100%; width: 16px; height: 9px; border: 1px solid var(--line); border-bottom: 0; }
  .windows { display: flex; flex-wrap: wrap-reverse; gap: 6px; width: 74px; }
  .win { width: 14px; height: 18px; background: var(--block-2); border: 1px solid var(--line); }
  .win.l1 { background: rgba(69, 224, 240, 0.28); border-color: var(--cyan); }
  .win.l2 { background: rgba(255, 181, 71, 0.7); border-color: var(--amber); }
  .win.l3 { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 10px rgba(255, 77, 148, 0.75); }
  .win.breached { border-color: var(--red); box-shadow: inset 0 3px 0 var(--red); }
  .win:hover { border-color: var(--ink); }
  .plot-label { height: 58px; border-top: 1px solid var(--line); padding: 10px 14px 0 4px; font-size: 0.8125rem; line-height: 1.3; color: var(--dim); white-space: nowrap; }
  .plot-label b { display: block; color: var(--ink); font-weight: 600; }
  .dark-note { color: var(--dim); margin: 20px 0 0; max-width: 60ch; }
  @media (prefers-reduced-motion: no-preference) {
    .win.lit { animation: power-on 0.5s ease-out backwards; }
    @keyframes power-on { from { background: var(--block-2); border-color: var(--line); box-shadow: none; } }
  }

  /* status strip */
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 36px 0 0; border: 1px solid var(--line); }
  .strip > div { padding: 16px 18px; border-left: 1px solid var(--line); }
  .strip > div:first-child { border-left: 0; }
  .strip dt { color: var(--dim); font-size: 0.8125rem; }
  .strip dd { margin: 4px 0 0; }
  .strip .big { font-family: var(--display); font-size: 2.25rem; line-height: 1; display: block; }
  .strip small { color: var(--dim); font-size: 0.8125rem; display: block; margin-top: 6px; }
  .keys { display: flex; gap: 5px; margin-top: 8px; }
  .keys i { width: 16px; height: 9px; border: 1px solid var(--dim); }
  .keys i.req { border-color: var(--amber); }
  .keys i.on { background: var(--cyan); border-color: var(--cyan); }
  .keys i.req.on { background: var(--amber); border-color: var(--amber); }

  /* body grid */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; margin-top: 48px; align-items: start; }
  h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 1.75rem; line-height: 1; letter-spacing: 0.02em; margin: 0; }
  .legend { color: var(--dim); font-size: 0.875rem; max-width: 68ch; margin: 0 0 28px; }

  .district { margin-bottom: 40px; }
  .district-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .district-head span { color: var(--dim); font-size: 0.875rem; white-space: nowrap; }
  .meter { display: flex; height: 3px; background: var(--block-2); margin: 10px 0 6px; }
  .meter i { display: block; }
  .meter .m3 { background: var(--pink); } .meter .m2 { background: var(--amber); } .meter .m1 { background: var(--cyan); }

  .entry { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 62px; align-items: center; gap: 14px; width: 100%; padding: 9px 8px; border-bottom: 1px solid rgba(58, 47, 107, 0.6); }
  .entry:hover { background: var(--block); }
  .entry.l0 .entry-name { color: var(--dim); }
  .entry.breached { box-shadow: inset 3px 0 0 var(--red); }
  .bie { display: flex; gap: 3px; }
  .bie i { width: 8px; height: 16px; background: var(--block-2); border: 1px solid var(--line); }
  .bie i.b.on { background: var(--cyan); border-color: var(--cyan); }
  .bie i.i.on { background: var(--amber); border-color: var(--amber); }
  .bie i.e.on { background: var(--pink); border-color: var(--pink); }
  .entry-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-id { display: block; font-family: var(--mono); font-size: 0.75rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-lives { font-size: 0.8125rem; color: var(--dim); white-space: nowrap; }
  .pips { display: flex; gap: 5px; align-items: center; color: var(--dim); font-size: 0.8125rem; }
  .pips i { width: 6px; height: 6px; transform: rotate(45deg); border: 1px solid var(--dim); }
  .pips i.on { background: var(--ink); border-color: var(--ink); }

  /* side column */
  aside section { margin-bottom: 40px; }
  aside h2 { margin-bottom: 14px; }
  .muted { color: var(--dim); font-size: 0.875rem; }
  ul.checks { list-style: none; margin: 0; padding: 0; }
  ul.checks li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 5px 0; font-size: 0.9375rem; }
  .box { width: 13px; height: 13px; border: 1px solid var(--dim); margin-top: 5px; display: inline-block; flex: none; }
  .box.on { background: var(--cyan); border-color: var(--cyan); }
  li.done { color: var(--dim); text-decoration: line-through; }
  .tag { font-size: 0.75rem; border: 1px solid var(--cyan); color: var(--cyan); padding: 0 5px; margin-left: 6px; white-space: nowrap; text-decoration: none; display: inline-block; }
  .tag.req { border-color: var(--amber); color: var(--amber); }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details summary { cursor: pointer; color: var(--dim); font-size: 0.875rem; }
  details h3 { font-size: 0.875rem; font-weight: 600; margin: 14px 0 2px; }

  .boss { display: block; width: 100%; padding: 12px 0; border-top: 1px solid var(--line); }
  .boss:hover .boss-name { color: var(--pink); }
  .boss-name { font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
  .boss-name span { font-weight: 400; color: var(--dim); font-size: 0.8125rem; white-space: nowrap; }
  .boss-tag { color: var(--dim); font-size: 0.8125rem; display: block; }
  .hp { height: 6px; background: var(--block-2); margin-top: 8px; }
  .hp i { display: block; height: 100%; background: var(--red); }
  .boss.down .boss-name { text-decoration: line-through; color: var(--dim); }

  .damage button { display: block; width: 100%; padding: 8px 0 8px 12px; border-left: 3px solid var(--red); margin-bottom: 8px; font-size: 0.9375rem; }
  .damage button b { display: block; font-weight: 600; }
  .damage button:hover { background: var(--block); }

  /* entry sheet */
  dialog { margin: 0 0 0 auto; height: 100dvh; max-height: none; width: min(600px, 100vw); max-width: none; border: 0; border-left: 1px solid var(--line); background: var(--block); color: var(--ink); padding: 0; }
  dialog::backdrop { background: rgba(8, 5, 20, 0.72); }
  .sheet { padding: 28px 32px 64px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .sheet h2 { font-size: 2.5rem; }
  .close { border: 1px solid var(--line); padding: 6px 12px; font-size: 0.875rem; flex: none; }
  .close:hover { border-color: var(--ink); }
  .state { margin: 14px 0 0; font-size: 0.9375rem; }
  .state b.l0 { color: var(--dim); } .state b.l1 { color: var(--cyan); } .state b.l2 { color: var(--amber); } .state b.l3 { color: var(--pink); }
  .state .br { color: var(--red); }
  .path { font-family: var(--mono); font-size: 0.8125rem; color: var(--dim); background: var(--night); padding: 8px 10px; margin: 14px 0 0; overflow-x: auto; white-space: nowrap; }
  .note { margin-top: 24px; max-width: 62ch; }
  .note h3 { font-family: var(--display); text-transform: uppercase; font-size: 1.375rem; letter-spacing: 0.02em; margin: 28px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .note h4, .note h5 { font-size: 1rem; margin: 18px 0 6px; }
  .note p { margin: 0 0 10px; }
  .note .prompt { color: var(--dim); }
  .note ul { margin: 0 0 10px; padding-left: 20px; }
  .note li { margin-bottom: 4px; }
  .note li:has(.box) { list-style: none; margin-left: -20px; display: grid; grid-template-columns: 16px 1fr; gap: 10px; }
  .note pre { background: var(--night); padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.55; margin: 0 0 12px; }
  .note code { font-family: var(--mono); font-size: 0.875em; background: var(--night); padding: 1px 5px; }
  .note pre code { background: none; padding: 0; font-size: inherit; }
  .note img { max-width: 100%; display: block; margin: 8px 0 12px; border: 1px solid var(--line); }
  .note a { color: var(--cyan); }
  .note table { border-collapse: collapse; margin: 0 0 12px; font-size: 0.9375rem; }
  .note th, .note td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .note th { color: var(--dim); font-weight: 600; }

  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; gap: 24px; }
    .strip { grid-template-columns: 1fr 1fr; }
    .strip > div:nth-child(3) { border-left: 0; }
    .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px 64px; }
    .strip { grid-template-columns: 1fr; }
    .strip > div { border-left: 0; border-top: 1px solid var(--line); }
    .strip > div:first-child { border-top: 0; }
    .entry { grid-template-columns: 34px minmax(0, 1fr) 62px; }
    .entry-lives { display: none; }
    .sheet { padding: 20px 18px 48px; }
  }
</style>
</head>

<script id="codex-data" type="application/json">{"cities":[{"id":"gcp-pca","title":"Professional Cloud Architect","subtitle":"Google Cloud","milestones":[{"label":"Cohort sessions end","date":"2026-12-08"},{"label":"Voucher form closes","date":"2026-12-29"},{"label":"Last day to sit the exam","date":"2027-01-20"}],"keysNeeded":5,"targetAccuracy":85,"districts":[{"id":"core","name":"Foundation"},{"id":"compute","name":"Compute"},{"id":"network","name":"Network"},{"id":"data","name":"Data"},{"id":"security","name":"Security"},{"id":"ops","name":"Operations"},{"id":"delivery","name":"Delivery"},{"id":"migrate","name":"Migration"},{"id":"ai","name":"AI"}],"cards":[{"id":"ai-agents-adk","name":"AI agents and the Agent Development Kit","district":"ai","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: An AI agent is a system that perceives its environment, decides, and acts on that environment through the tools it has been given, working toward a goal. The Agent Development Kit (ADK) is Google's open-source framework for building agents and multi-agent systems in code.\n- Trainer: the architect exam asks about agents at concept level only. Building and orchestrating them is a separate, newer exam.\n- Parts of an agent: a model (the reasoning), instructions (role and goal), tools (functions, APIs, search, other agents) and memory or session state.\n- Multi-agent: a coordinator hands sub-tasks to specialist agents. ADK's workflow agents fix the order when the model shouldn't decide it: sequential, parallel, loop.\n- Protocols to recognise: MCP (Model Context Protocol) connects an agent to tools and data; A2A (Agent2Agent) lets agents from different vendors talk to each other.\n- Where it runs: develop locally with ADK, deploy to Agent Runtime (the managed runtime, formerly Vertex AI Agent Engine) or as a container on Cloud Run or GKE.\n- Names in the exam guide: Agent Builder (the build-an-agent tooling, now folded into Gemini Enterprise Agent Platform), Gemini Enterprise (the product where staff find and use agents; it absorbed Agentspace), NotebookLM (a research and summarising assistant grounded in your own documents).\n- Guardrails: least-privilege identity and tools for the agent, Model Armor on inputs and outputs, human approval for risky actions (Cymbal Retail wants human-in-the-loop review), evaluation and tracing.\n- Customer-service chat and voice bots have their own low-code route (conversational agents, formerly Dialogflow CX), e.g. to replace Cymbal's IVR.\nLike what I know: A workflow engine where the LLM picks the next step and which function to call, instead of me hard-coding the sequence.\n\n## Isolate\nPick it when: A task needs several steps, decisions and tool calls that can't be scripted in advance: a support assistant that looks up an order, checks the policy and issues a refund.\nNot it when (use a single Gemini call instead): One prompt in, one answer out (summarise, classify, extract). If the steps are fixed and known, a workflow (Workflows, Application Integration) is cheaper and more predictable than an agent.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ai-gemini-models","name":"Gemini models on Vertex AI","district":"ai","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's family of multimodal generative AI models (text, images, audio, video, code), used through Vertex AI. An LLM is pre-trained on a huge dataset, then can be tuned for a purpose with a much smaller one.\n- Prompt types: zero-shot, one-shot, few-shot, role. Few-shot with output examples forces a structure such as custom JSON.\n- Good prompts: clear, concise, direct, with a persona and constraints.\n- Hallucinations (confident wrong output) come from missing context, too little data or dirty data. Reduce with grounding (Google Search or your own data), constraints and curated data.\n- Gemini is proprietary: closed weights, used through the API. Gemma is the open-weight family you can download and run anywhere.\n- Other model types: Imagen for text-to-image (the newer Gemini image models, \"Nano Banana\", also edit images), and embeddings models that turn text or images into vectors for search and RAG.\n- Gemini Cloud Assist: the assistant panel in the console for designing, operating and troubleshooting. It summarises the log entries around an error spike and suggests fixes. Gemini Code Assist: the coding assistant inside an IDE or the Cloud Shell Editor. A deliberate exam look-alike pair.\n- Names changed in October and November 2026: Gemini 4 Carbon, Neon and Hydrogen (plus Argon) replace the Pro and Flash names. Trainer expects the exam to still say Pro, Flash and Flash-Lite.\n- Model size: the large tier for hard reasoning, the small tiers for speed and cost at volume. Start small and move up only when quality demands it.\n- Customising, cheapest first: prompt design, then grounding or RAG, then tuning (supervised fine-tuning) when the others fall short.\n- Model Garden (exam guide): the catalogue of Google, partner (e.g. Anthropic Claude) and open models (Gemma, Llama) to call or deploy.\n- Paying: pay-as-you-go per token, or Provisioned Throughput to reserve capacity for predictable latency. Batch requests cost less when the answer can wait.\n- Safety: built-in safety filters, plus Model Armor for prompt injection and data leaks.\n- Case study uses: Cymbal Retail derives product attributes from text and images and edits product images; Altostrat Media summarises and tags media.\nLike what I know: Calling a hosted model API such as OpenAI's: send a prompt, get a completion, pay per token.\n\n## Isolate\nPick it when: Generating or understanding content (summarize, classify, extract, chat, code) with a managed foundation model instead of training your own.\nNot it when (use a custom model on Vertex AI instead): A narrow prediction on your own structured data (fraud score, demand forecast) where classic ML fits better.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"ai-vertex-ai","name":"Vertex AI","district":"ai","threat":2,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google Cloud's managed platform for machine learning and generative AI: use foundation models (Gemini), tune them, train and serve your own models, and run the operations around them. Renamed Gemini Enterprise Agent Platform in April 2026; the exam and courses may still say Vertex AI.\n- Concepts to recognise at a high level: training, serving, MLOps, prompting, tuning, and retrieval-augmented generation (RAG: answer from your own data).\n- Layers: infrastructure (CPUs, GPUs, TPUs), data platform, models, agents.\n- Data vocabulary: structured or unstructured, labeled or unlabeled, data quality.\n- Trainer: the architect exam stays shallow here.\n- Three ways to get a model, least effort first: call a pre-trained API (the exam guide's 'Google AI APIs': Vision, Speech, Translation, Natural Language, Video, Document AI), use or tune a foundation model, or train your own (AutoML with no code, or custom training on GPUs or TPUs).\n- Parts by exam guide name: Model Garden (model catalogue), Vertex AI Studio (try prompts; now Agent Studio), Vertex AI Pipelines (the ML lifecycle as repeatable steps: prepare data, train, evaluate, deploy; the MLOps answer), Agent Builder, endpoints for online prediction and batch prediction for bulk work, Model Registry, Feature Store, Vector Search.\n- Vertex AI Search (now Agent Search): search and RAG over your own data. The commerce edition does product discovery and recommendations for retail; the Cymbal case calls it Discovery AI.\n- BigQuery ML when the data already sits in BigQuery and SQL is the team's language.\n- AI Hypercomputer is the infrastructure layer underneath (GPUs, TPUs, fast storage and networking, schedulers). Recognise the name; see `compute-gpus`.\n- Securing AI (exam guide 3.1): Model Armor on prompts and responses, Sensitive Data Protection on training data, private endpoints and VPC Service Controls around models and data, least-privilege service accounts, CMEK.\n- Serving cost: an online endpoint keeps nodes running and bills while idle; batch prediction is cheaper for work that isn't urgent.\nLike what I know: The framework around a UI library: the model API is the library, and this adds the build, deploy and monitoring around it.\n\n## Isolate\nPick it when: The team needs a managed place to build with AI on Google Cloud: call or tune foundation models, train and serve custom ones and automate the lifecycle, without running the infrastructure.\nNot it when (use a pre-trained API instead): A ready-made API already does the job (translate text, read a document, transcribe audio), so no model work is needed. If the data and the team live in BigQuery, BigQuery ML.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-app-engine","name":"App Engine","district":"compute","threat":2,"estimate":false,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: PaaS for web apps and APIs: deploy code, Google runs and scales it.\n- Standard environment: sandboxed runtimes, scales to zero.\n- Flexible environment: runs on VMs, more runtime freedom, doesn't scale to zero.\n- One App Engine app per project, and its region is fixed at creation.\n- Flexible allows SSH into its VMs (off by default) and background processes; standard allows neither. Standard starts faster and handles sudden spikes better.\n- Released in 2008 and still examined: know standard versus flexible.\n- Versions and traffic splitting are built in: deploy a new version, send it a share of traffic (canary or A/B), roll back by moving traffic.\n- Standard: specific language runtimes, instances start in seconds. Flexible: any runtime in a Docker container, minutes to start, at least one instance always running.\nLike what I know: Heroku: push code, get a URL, the platform runs it.\n\n## Isolate\nPick it when: An existing App Engine app, or a case study that already runs on it.\nNot it when (use Cloud Run instead): It's a new serverless web app. Google now points most new work to Cloud Run.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-cloud-functions","name":"Cloud Run functions (Cloud Functions)","district":"compute","threat":2,"estimate":false,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Single-purpose functions that run on an event. You write only the function; Google builds it and runs it on Cloud Run. (Formerly Cloud Functions.)\n- Triggers: HTTP (synchronous), or events from Cloud Storage, Pub/Sub and others through Eventarc (asynchronous).\n- Billed only while running; scales to zero. Integrated with Cloud Logging and Monitoring.\n- Limits to design around: one function, one trigger. HTTP functions can run up to 60 minutes, event-driven ones up to 9.\n- Events are delivered at least once, so the same event can arrive twice: make event handlers idempotent.\n- Reaches private resources in a VPC the same way Cloud Run does (Direct VPC egress or a connector).\nLike what I know: AWS Lambda.\n\n## Isolate\nPick it when: Small event-driven glue code: resize an image when it lands in a bucket, react to a Pub/Sub message, connect Cloud services.\nNot it when (use Cloud Run instead): It's a full app or service with many routes, a custom container, or more than one job.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-cloud-run","name":"Cloud Run","district":"compute","threat":2,"estimate":false,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Serverless containers, built on Knative. Deploy a container image from Artifact Registry, or source code (Buildpacks builds it), and get an HTTPS URL. Scales out with requests and back to zero.\n- Pay for CPU and memory while handling requests (to the 100 ms), plus a fee per million requests. Bigger containers cost more. Minimum instances avoid cold starts.\n- Containers must be stateless. Services answer requests; jobs run tasks to completion.\n- Regional. For multi-region, put several behind a global Application Load Balancer.\n- Cold starts unacceptable: set minimum instances (2 keeps two warm). Maximum instances, CPU limit and ingress settings don't help.\n- Google's recommendation for new serverless apps, ahead of App Engine. Serverless first, then fully managed, then VMs: the further that way, the more of the security work is Google's.\n- Outgrow it and the same container image deploys to GKE.\n- Revisions: every deploy creates an immutable revision. Split traffic by percentage between revisions for canary or blue/green, and roll back at once.\n- Concurrency: one instance serves many requests at the same time (80 by default). Lower it for CPU-heavy work. Request timeout up to 60 minutes.\n- Reaching private resources (Cloud SQL private IP, Memorystore): Direct VPC egress, or a Serverless VPC Access connector.\n- Who can call it: ingress setting (all, internal, or internal plus load balancer) and IAM (Cloud Run Invoker). Allow unauthenticated only for public sites.\n- Third shape besides services and jobs: worker pools, always-on background workers with no HTTP endpoint (e.g. pulling from Pub/Sub).\n- GPUs can be attached for model inference, still scaling to zero.\nLike what I know: Vercel or Netlify functions, but for any container: hand over an image, get an HTTPS URL, pay per request.\n\n## Isolate\nPick it when: Stateless web apps, APIs or microservices in containers that should scale automatically, including to zero, with no infrastructure to manage.\nNot it when (use GKE instead): You need Kubernetes features or node-level control. For a single event handler, use Cloud Run functions.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-engine","name":"Compute Engine","district":"compute","threat":3,"estimate":false,"livesAt":"zonal","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: IaaS virtual machines. You pick machine type, OS image, disks and network; you manage the OS and everything on it.\n- Machine families: general-purpose, compute-optimized, memory-optimized, accelerator (GPUs). Custom machine types when presets don't fit.\n- Per-second billing (1-minute minimum). Sustained-use discounts apply automatically on some machine series; committed-use discounts (1 or 3 years) for steady workloads.\n- A VM lives in one zone. For high availability, use managed instance groups across zones.\n- Network bandwidth is set per VM by vCPU count (about 2 Gbps per vCPU, up to the machine series' cap). More memory doesn't raise it and neither do extra network interfaces. Egress to external IPs has a lower cap (7 Gbps on most series).\n- The letter isn't the family: C3 and C4 are general-purpose, C2 and C2D are compute-optimized. Know the families, not every series.\n- If security blocks SSH (no firewall allow for tcp:22), operations still manage VMs through IAM roles and gcloud.\n- Availability policy: on host maintenance a VM live-migrates by default (keeps running while Google patches the host); automatic restart brings it back after a crash. VMs with GPUs can't live-migrate and are stopped instead.\n- Repeatable VMs: a startup script (metadata) configures the VM at boot; a custom image bakes the software in; an instance template records the whole recipe for a managed instance group.\n- A stopped VM costs nothing for CPU and memory but still pays for its disks and reserved static IPs. Changing machine type needs the VM stopped.\n- OS Login ties SSH access to IAM instead of scattered SSH keys. Shielded VM (secure boot, vTPM) protects the boot chain; Confidential VM encrypts memory while in use.\n- Patching at scale: VM Manager (OS patch management, OS inventory, OS policies). The exam guide lists patch management under configuring compute.\n- A reservation guarantees capacity in a zone; a committed-use discount only guarantees price. Rightsizing recommendations appear after about a week of metrics.\nLike what I know: A VPS or an EC2 instance: a server I SSH into and maintain myself.\n\n## Isolate\nPick it when: You need full OS control: lift-and-shift, specific OS or licensing, legacy software, GPUs, or software that won't containerize.\nNot it when (use GKE or Cloud Run instead): The app is containerized and you'd rather not manage VMs and OS patching.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-gke","name":"Google Kubernetes Engine","district":"compute","threat":3,"estimate":true,"livesAt":"zonal or regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google-managed Kubernetes. GKE runs the control plane; nodes are Compute Engine VMs. Sits between PaaS automation and IaaS control.\n- Pod: the smallest deployable unit. One or more containers that share network and storage and are deployed together.\n- Declarative: describe the desired state (5 replicas) in config, kubectl apply, Kubernetes makes it so.\n- Autopilot (recommended): Google manages nodes, scaling, upgrades and security; you pay for what pods request. Standard: you manage node pools and pay per node.\n- Zonal cluster: control plane in one zone. Regional cluster: control plane and nodes replicated across zones.\n- Built in: node auto-repair, auto-upgrade, cluster autoscaler, Cloud Logging and Monitoring.\n\nWorkloads:\n- Deployment: the object that keeps N replicas of a pod running and rolls out new versions. Service: the stable address that spreads traffic across those pods; it sits between the load balancer and the pods.\n- Usually one container per pod. Extra containers are sidecars (mesh proxy, monitoring agent). Containers in a pod talk over localhost with nothing exposed, but they're now coupled, which works against microservices.\n- Horizontal Pod Autoscaler adds pods (scale out). Vertical Pod Autoscaler makes pods bigger (scale up).\n- Requests: what a container needs, used by the scheduler to place it. Limits: the most it may use.\n- Rolling update: `maxSurge` is how many extra pods may exist above the target, `maxUnavailable` how many may be down. New pod in, old pod out, automatically; both versions run side by side for a while. Canary: send the new version to a small share (10%) first.\n- PodDisruptionBudget (`minAvailable` or `maxUnavailable`): how many pods must stay up during planned disruptions such as node upgrades. Readiness probe gates traffic to a pod; liveness probe restarts it.\n\nAutopilot or Standard:\n- Trainer: Autopilot fits about 80% of cases and is close to serverless in practice, but the exam still counts GKE as fully managed, not serverless.\n- Standard is for node-level control: custom node pools, your own machine shapes (GPU, Spot), bin packing to keep utilization high and cost low.\n- Pod placement controls: node selector (pods go to nodes with a label, e.g. GPU nodes), affinity and anti-affinity (keep pods together, or apart for availability), taints and tolerations (a taint keeps everything off a node except pods that tolerate it). Trainer: these are for Standard.\n- Shielded GKE Nodes are always on in Autopilot and on by default in Standard.\n\nSecurity:\n- Workload Identity Federation for GKE (the trainer and older material say \"Workload Identity\"): ties a Kubernetes service account to IAM so pods call Google APIs with no key files. Google's recommended way; expect a question.\n- Access: IAM at project and cluster level, plus Kubernetes RBAC for finer control inside the cluster (per namespace, per team).\n- GKE Sandbox (gVisor): an extra isolation layer between a container and the node's kernel, for untrusted code such as a third-party image.\n- Private cluster: nodes have no external IPs. Outbound through Cloud NAT, Google APIs through Private Google Access.\n- Pulling a private image: grant Artifact Registry Reader to the node service account, and don't run nodes as the default Compute Engine service account.\n\nNetwork and operations:\n- IP planning: nodes take addresses from the subnet's primary range, pods from a secondary range. Default maximum is 110 pods per node, so each node gets a /24 of pod addresses. A /29 subnet has 8 addresses, 4 usable (Google reserves 4), so 4 nodes and a /21 pod range. A changed pods-per-node maximum changes the sum.\n- Release channels: Rapid, Regular, Stable. Production on Regular or Stable. Upgrade and release notifications can go to a Pub/Sub topic and fan out from there.\n- Separate environments (at least pre-production and production), each tied to a suitable release channel.\n- Service mesh (Istio; Google's managed one is Cloud Service Mesh): sidecar proxies handle traffic policy, security and telemetry between services, set once at mesh level. Anthos no longer exists as a brand; multi-cluster management is now GKE fleets.\n\nMore to recognise:\n- Node scaling: cluster autoscaler adds or removes nodes; node auto-provisioning creates whole node pools to fit pending pods. HPA and VPA act on pods, these act on nodes.\n- State: a PersistentVolumeClaim asks for a disk; a StatefulSet gives each replica a stable name and its own volume (databases, queues). Deployments are for stateless pods.\n- Exposing apps: Service types ClusterIP (inside the cluster only), NodePort, LoadBalancer (a passthrough Network LB). Ingress or the Gateway API creates an Application LB for HTTP routing. Container-native load balancing sends traffic straight to pods through NEGs.\n- Network policies restrict pod-to-pod traffic: a firewall inside the cluster.\n- Binary Authorization: only images signed (attested) by your pipeline can be deployed. The software supply chain control.\n- Several regions: a multi-cluster Gateway puts one global load balancer in front of clusters in different regions. Backup for GKE backs up workloads and their volumes.\n- Case study hook (EHR Healthcare): existing Kubernetes on-prem that must run the same way as the cloud. GKE with fleets, attached or on-prem clusters, and Config Sync to keep configuration identical.\nLike what I know: Docker Compose grown up. I declare the desired state in YAML and a controller keeps reality matching it, the way React reconciles the DOM to the declared UI.\n\n## Isolate\nPick it when: Many containerized services that need Kubernetes features: custom networking, stateful workloads, sidecars, or portability to other Kubernetes environments (hybrid, multicloud).\nNot it when (use Cloud Run instead): Stateless containers serving HTTP requests, where you don't need Kubernetes control.\n- \"Fully serverless\" in the scenario points to Cloud Run. The same container image can move to GKE later if it outgrows Cloud Run.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-gpus","name":"Cloud GPUs","district":"compute","threat":1,"estimate":false,"livesAt":"zonal","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Graphics processors attached to Compute Engine VMs (also GKE nodes and Cloud Run) to speed up work that runs huge numbers of calculations in parallel: ML training and inference, rendering, simulation, video transcoding.\n- Two ways to get one: an accelerator-optimized machine type with GPUs built in (the A and G series), or GPUs attached to an N1 general-purpose VM.\n- GPU VMs can't live-migrate: host maintenance stops them. Set the VM to restart, and expect Local SSD data on it to be lost.\n- Expensive and capacity-limited: you need GPU quota in the region and not every zone has every model.\n- Ways to pay (the exam guide's 'consumption models'): on-demand, Spot (much cheaper, for interruptible training), committed use, reservations, and Dynamic Workload Scheduler (queue for scarce GPUs and start when capacity is free).\n- TPUs are Google's own ML chips, used through Vertex AI and GKE rather than attached to an ordinary VM.\n- AI Hypercomputer is Google's name for the whole AI infrastructure stack: GPUs and TPUs plus the storage, networking and software tuned for them. Named in the exam guide; recognise it.\nLike what I know: A dedicated graphics card in a render farm: rented by the hour, pointless unless the software is written to use it.\n\n## Isolate\nPick it when: The workload is massively parallel maths and the software can use a GPU: model training, inference at scale, rendering, scientific simulation.\nNot it when (use a managed AI service instead): You only need to call a model. Gemini on Vertex AI or a pre-trained API needs no GPU of your own. Ordinary web and database workloads gain nothing from one.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-instance-groups","name":"Managed instance groups","district":"compute","threat":2,"estimate":false,"livesAt":"zonal or regional","b":true,"i":true,"e":true,"level":3,"missed":[],"body":"\n## Baseline\nWhat it is: A managed instance group (MIG) is a set of identical VMs built from one instance template and run as a single unit. It keeps the group at its target size, replaces broken VMs, scales with load and rolls out new versions.\n- Instance template: the recorded recipe (machine type, image, disk, network, tags, startup script). Creating one looks exactly like creating a VM. It can't be edited: to change something, make a new template and roll it out.\n- Autohealing: if a VM stops, crashes, is deleted outside the group or fails its health check, the MIG recreates it with the same name and template.\n- Regional (multi-zone) MIGs are recommended over zonal: VMs spread across zones, so one zone failing doesn't take the app down.\n- Autoscaling signals: CPU utilization, load balancer capacity (utilization or requests per second), Cloud Monitoring metrics, or a schedule. Queue-based scaling, e.g. unacknowledged Pub/Sub messages, goes through a Cloud Monitoring metric.\n- It's a target, not a trigger. With a 75% CPU target and two VMs at 100% and 85%, the autoscaler adds a VM to bring the average under 75%. It removes VMs only while the rest still fit under the target.\n- Health check: protocol, port, check interval, timeout, healthy threshold, unhealthy threshold. A VM is unhealthy only after that many failures in a row. Much like an uptime check in Cloud Monitoring.\n- Initial delay (initialization period): how long after boot before health checks and autoscaling count the VM. Too short and the group kills VMs that are still starting.\n- Health check probes come from 130.211.0.0/22 and 35.191.0.0/16. Without a firewall rule allowing them, every VM looks unhealthy.\n- Updates: rolling (replace gradually, with max surge and max unavailable) or canary (two templates side by side, a share of VMs on the new one).\n- Stateless MIGs suit web front ends and batch workers pulling from a queue. Stateful MIGs keep each VM's disks, name and IPs through recreation, for databases and legacy apps. Stateful IPs: internal and external IPv4 addresses survive autohealing and updates, which helps when clients or config depend on a fixed address or a migrated workload must keep its network setup.\n- Unmanaged instance group: a hand-picked set of different VMs behind a load balancer. No autoscaling, autohealing or rolling updates.\nLike what I know: A pool of identical CI runners built from one image: add runners when the queue grows, remove them when it's quiet, replace any that hang.\n\n## Isolate\nPick it when: Identical, stateless VMs that should scale with load, heal themselves and sit behind a load balancer.\nNot it when (use an unmanaged instance group instead): The VMs differ from each other and you only need to group existing machines behind a load balancer. If the app is already in containers, GKE or Cloud Run does the same job with less to manage.\n\n## Execute\nWhat I built: Badge lab, 2026-11-23. `lb-backend-group`, 2 VMs from an instance template, as the backend of a global Application LB. Set the named port `http:80` so the backend service could find it. Runbook: `labs/01-load-balancing-compute-engine.md`.\n\n```bash\ngcloud compute instance-groups managed create lb-backend-group \\\n  --template=lb-backend-template --size=2 --zone=$ZONE\ngcloud compute instance-groups managed set-named-ports lb-backend-group \\\n  --named-ports http:80 --zone=$ZONE\n```\n\nCourse lab (Elastic Infrastructure: Application LB with autoscaling), date to add. Built a custom image first: VM `webserver` with Apache enabled at boot (`sudo systemctl enable apache2`), boot disk set to be kept, VM deleted, image `mywebserver` made from the disk. Template `mywebserver-template` (e2-micro, that image, tag `allow-health-checks`, no external IP). Two regional MIGs from it, `us-1-mig` and `notus-1-mig`: 1 to 2 instances, autoscaling on HTTP load balancing utilization at 80%, initialization period 60 s, autohealing with `http-health-check` and a 60 s initial delay. Under the stress test both groups scaled out. Console build; the CLI form below is not yet run.\n\n```bash\ngcloud compute instance-groups managed create us-1-mig \\\n  --template=mywebserver-template --size=1 --region=$REGION \\\n  --health-check=http-health-check --initial-delay=60\ngcloud compute instance-groups managed set-autoscaling us-1-mig --region=$REGION \\\n  --min-num-replicas=1 --max-num-replicas=2 \\\n  --target-load-balancing-utilization=0.8 --cool-down-period=60\n```\n\n## Missed\n"},{"id":"compute-local-ssd","name":"Local SSD","district":"compute","threat":1,"estimate":false,"livesAt":"zonal (tied to one VM)","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: SSD storage physically attached to the server that hosts the VM, instead of reached over the network. Very high IOPS and very low latency, but temporary: the data lives and dies with the VM.\n- Survives a guest reboot and live migration. Lost when the VM is stopped, deleted or preempted, or when the host fails. (Keeping the data through a stop is in Preview and not on every machine type.)\n- Fixed-size 375 GiB disks chosen when the VM is created; you can't add one afterwards. On the newer machine series it's called Titanium SSD and comes with specific `-lssd` machine types.\n- No snapshots, no images, can't be detached and moved to another VM. Always encrypted.\nLike what I know: The build cache or /tmp on a CI runner: very fast, gone when the machine goes.\n\n## Isolate\nPick it when: Scratch space, caches, temp files and processing where speed matters and the data can be rebuilt, or is replicated elsewhere by the software.\nNot it when (use Hyperdisk or Persistent Disk instead): The data must outlive the VM. Anything you'd be upset to lose goes on durable network disks.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-persistent-disk","name":"Persistent Disk","district":"compute","threat":3,"estimate":false,"livesAt":"zonal or regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Durable network block storage for VMs. The disk is a separate resource from the VM, so the data survives a stop, a crash or deleting the VM. Two generations: Persistent Disk (older) and Hyperdisk (newer, recommended, and the only choice on the latest machine series).\n- Persistent Disk types, cheapest to fastest: standard (`pd-standard`, HDD), balanced (`pd-balanced`, SSD, the console default), SSD (`pd-ssd`), extreme (`pd-extreme`). Performance grows with disk size and the VM's vCPU count.\n- Hyperdisk: IOPS and throughput are set separately from size. Balanced for most workloads, Extreme for top-end databases, Throughput for analytics, ML for read-heavy model data shared by many VMs, Balanced High Availability for a disk replicated across two zones.\n- Zonal by default. A regional disk replicates synchronously to a second zone in the same region, so a database can fail over to the other zone without losing data.\n- A disk can grow at any time with no downtime (then extend the file system). It can't shrink.\n- Snapshots: incremental backups stored apart from the disk, usable to create a disk in any region. Snapshot schedules automate them. An image is for booting new VMs; a snapshot is for backup.\n- Encrypted at rest by default. Options: customer-managed keys in Cloud KMS (CMEK) or customer-supplied keys (CSEK).\n- Sharing: several VMs can attach one disk read-only. Multi-writer needs Hyperdisk and software built for shared disks. For a shared file system, Filestore.\n- The boot disk is deleted with the VM by default. Turn auto-delete off to keep it (the Application LB lab does this to build a custom image from the disk).\nLike what I know: An external drive plugged into the VM over the network: unplug it and the data stays, plug it into another machine.\n\n## Isolate\nPick it when: A VM needs a boot disk or durable block storage: databases, application data, anything that must survive the VM.\nNot it when (use Local SSD instead): Temporary data that needs the lowest possible latency and can be lost. For files shared by many VMs, Filestore; for objects, Cloud Storage.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-sole-tenant-nodes","name":"Sole-tenant nodes","district":"compute","threat":2,"estimate":false,"livesAt":"zonal","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: A physical Compute Engine server reserved for your project alone. Your VMs run on it and nobody else's do. They are still ordinary VMs; you just control which hardware they land on.\n- A node template defines the server type; a node group is a set of those servers. VMs are steered onto them with node affinity labels.\n- Main reasons: bring-your-own licences counted per physical core or socket (Windows Server, SQL Server, Oracle), and compliance or security rules that demand physical isolation from other customers.\n- The maintenance policy can keep VMs on the same physical server or move them only within the node group, which per-core licences often require.\n- You pay for the whole node plus a sole-tenancy premium, full or not. CPU overcommit packs more VMs onto it.\n- Migration Center can build a TCO report with sole-tenant nodes as the target.\nLike what I know: A dedicated server instead of shared hosting.\n\n## Isolate\nPick it when: Licensing tied to physical cores or sockets, or a rule that workloads can't share hardware with other tenants.\nNot it when (use standard Compute Engine VMs instead): Isolation at VM level is enough, which it is for most workloads. If the software can't run on a VM at all, Bare Metal Solution.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"compute-spot-vms","name":"Spot and preemptible VMs","district":"compute","threat":2,"estimate":false,"livesAt":"zonal","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Spare Compute Engine capacity at a 60 to 91% discount. Google can stop them at any time with 30 seconds' notice. No maximum runtime (the older preemptible VMs stopped after 24 hours).\n- No SLA; availability varies.\n- Pair with a managed instance group so they're recreated when capacity returns.\n- Same machine types and performance as standard VMs; only price and availability differ. No live migration, no automatic restart.\n- Design for it: checkpoint work, use a shutdown script to save state in the 30 seconds, and keep a baseline of standard VMs when there's a deadline.\n- Also available as Spot node pools on GKE and for GPUs.\nLike what I know: A low-priority CI queue: cheap, but a job can be bumped at any moment and has to be restartable.\n\n## Isolate\nPick it when: The work can be interrupted and restarted: batch processing, rendering, CI jobs, data crunching.\nNot it when (use standard VMs with committed-use discounts instead): The workload must stay up (web servers, databases) but you still want savings on steady usage.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-billing-cost","name":"Billing and cost controls","district":"core","threat":2,"estimate":true,"livesAt":"global","b":true,"i":true,"e":true,"level":3,"missed":[],"body":"\n## Baseline\nWhat it is: Everything a project's resources consume adds up into one billing account. The controls on top of that are budgets, quotas, labels and billing export.\n- Budget: set one to plan a project and keep costs under control. An alert at 100% only emails the billing admins; it doesn't stop spending.\n- Quotas, three kinds: how many resources per project (e.g. VPC networks), how fast you can call an API (rate limits), how many resources per region (e.g. CPUs).\n- Why quotas: stop runaway consumption from a mistake or an attack, avoid billing spikes, and force a sizing review (do I really need 96 cores?).\n- A quota is a ceiling, not a guarantee: the resource can still be unavailable (a region out of SSDs) while you have quota left.\n- Labels by team or cost center split the bill. Export billing to BigQuery to query it.\n- One billing account pays for many projects; a project links to exactly one. Billing roles (Billing Account Administrator, Billing Account User) sit on the billing account, separate from project roles.\n- A budget can also publish to Pub/Sub, and a function listening there can act (e.g. disable billing on a project). That is the only way a budget stops anything.\n- Discounts: sustained-use (automatic, some Compute Engine series), committed-use (1 or 3 years, by resource or by spend), Spot VMs for interruptible work. Recommender (Active Assist) suggests rightsizing and idle resources to delete.\n- CapEx to OpEx: no hardware bought up front, pay for what's used. The exam guide lists this under cost optimisation.\n- Before building: Pricing Calculator for an estimate, Migration Center for a TCO report on a migration.\nLike what I know: A performance budget in CI. It warns when the bundle is over; only a hard limit (a quota) actually fails the build.\n\n## Isolate\nPick it when: The question is about seeing, splitting or limiting spend: budgets to track it, labels to attribute it, quotas to cap usage, BigQuery export to analyse it.\nNot it when (use Organization Policy instead): The goal is to restrict what can be created or where, not how much is used.\n\n## Execute\nWhat I built: Queried a sample billing export in BigQuery to find the most expensive service. Details on the data-bigquery card.\n\n## Missed\n"},{"id":"core-cloud-identity","name":"Cloud Identity","district":"core","threat":2,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's identity service for users and groups who aren't on Google Workspace, managed in the Google Admin console. Setting it up for a domain is what gives a company its organization node.\n- Sync users from Active Directory or LDAP with Google Cloud Directory Sync, or keep an existing identity provider (Entra ID, Okta) for single sign-on via SAML.\n- Free and Premium editions.\n- Users are created and managed here (or in Workspace), not in IAM. Same Admin console as Workspace, without paying for the collaboration products.\n- Google Cloud Directory Sync is one-way: Active Directory or LDAP stays the source of truth and Google is updated to match.\n- Workforce Identity Federation: staff sign in with the external identity provider directly, with no synced Google accounts. (Workload Identity Federation is the same idea for machines.)\n- Case study hook: EHR Healthcare manages users in Microsoft Active Directory and needs sign-in to stay consistent during the migration.\nLike what I know: The company SSO directory (Okta, Entra ID) behind a 'Sign in with' button. It owns the accounts; each app only decides what an account may do.\n\n## Isolate\nPick it when: The company needs managed Google identities for staff, especially when they already run Active Directory or their own SSO.\nNot it when (use Google Workspace instead): They also need Gmail, Docs and Drive. Workspace includes the same identity features.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-iam","name":"IAM roles and policies","district":"core","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Who (principal) can do what (role) on which resource. Roles are bundles of permissions, granted in allow policies at any level of the hierarchy and inherited downward. Deny policies block specific permissions regardless of what's granted.\n- Principals (members), five types: Google accounts, service accounts, Google groups, Google Workspace domains, Cloud Identity domains. Grant to groups, not individuals. IAM doesn't create or manage users; Cloud Identity or Workspace does.\n- Policy: a list of bindings. A binding ties a list of members to one role; a role is a named list of permissions.\n- Basic: Owner, Editor, Viewer (now \"legacy basic\"; newer basic roles are Admin, Writer, Reader). Thousands of permissions; avoid in production.\n- Predefined: per-service roles from Google, e.g. roles/storage.objectViewer.\n- Custom: your own permission set, project or org level only, and you maintain it.\n- Allow policies only add on the way down: a child can't remove a role granted above. Use a deny policy for that.\n- Best practice: least privilege, lean on the hierarchy, audit policies and group membership.\n- Organization restrictions (not Organization Policy): stops data exfiltration through phishing or insiders. An egress proxy adds a header to requests from managed devices so they only reach approved organizations.\n- Exam reflex: IAM is Google's preferred way to control access. Uniform bucket-level access over ACLs, IAM roles and gcloud when SSH is blocked, an Artifact Registry role for image pulls. An option that bypasses IAM checks is wrong.\n- Common real-world failures (OWASP Top 10 2025, first and second): broken access control and security misconfiguration. Default service accounts, the default VPC and broad roles kept \"for now\".\n- Service account impersonation: a person or workload borrows a service account's identity through a short-lived token instead of holding its key. Needs Service Account Token Creator. In the exam guide under secure remote access.\n- IAM Conditions: a binding that applies only when a condition holds (a time window, a resource name prefix, an access level).\n- Separation of duties: split roles so nobody can both make and approve a change. The key admin doesn't read the data; billing admins aren't project owners.\n- Audit: Cloud Audit Logs record who did what. Admin Activity logs are always on; Data Access logs are off by default (except BigQuery) and must be turned on.\n- Tools: Policy Troubleshooter (why was this allowed or denied), Policy Analyzer (who can reach what), IAM recommender (roles nobody has used in 90 days).\nLike what I know: Route guards and role-based permissions in a web app: the user carries roles, each role unlocks a set of actions, and the check happens on every request.\n\n## Isolate\nPick it when: A predefined role covers the job. That's Google's default recommendation for least privilege.\nNot it when (use a custom role instead): Even the narrowest predefined role grants more than the job needs.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-org-policy","name":"Organization Policy","district":"core","threat":2,"estimate":true,"livesAt":"organization, folder or project","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Guardrails on what may be configured, set at organization, folder or project level and inherited downward. IAM says who may act; an org policy says what nobody may do, whatever their role.\n- Built from constraints. Ones to recognise: restrict resource locations (`gcp.resourceLocations`, the data residency answer), no external IPs on VMs (`compute.vmExternalIpAccess`), no service account keys (`iam.disableServiceAccountKeyCreation`), skip the default network (`compute.skipDefaultNetworkCreation`), require OS Login, enforce uniform bucket-level access, domain restricted sharing (only identities from your domain can be granted roles).\n- Set by someone with Organization Policy Administrator. Unlike IAM allow policies, a policy set lower down can replace the one it inherits.\n- Custom constraints cover fields the built-in ones don't. Dry-run mode logs what would be blocked before you enforce.\n- Not retroactive: resources that already break a new policy keep running. It bites on create and update.\nLike what I know: A shared ESLint config enforced from the monorepo root: it bans patterns for everyone, whatever their repo permissions are.\n\n## Isolate\nPick it when: A rule must hold across many projects regardless of who holds which role: only EU regions, no external IPs, no service account keys.\nNot it when (use IAM instead): The question is who can do something, not whether it's allowed at all. To stop data leaving through Google APIs, VPC Service Controls.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-regions-zones","name":"Regions and zones","district":"core","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Where resources physically run. A region is a geographic area (us-central1) made up of zones (us-central1-a). Every resource is zonal, regional or global, and that scope decides what one failure can take down.\n- Several zones in one region: survives a zone failure, with low latency between parts.\n- Several regions: closer to users worldwide, and survives a whole-region outage.\n- Region choice also answers data residency and compliance requirements.\n- Scope examples. Zonal: VM, zonal disk, zonal MIG. Regional: subnet, regional MIG, Cloud SQL instance, Cloud Run service, Cloud NAT, Cloud VPN gateway, Cloud Router. Global: VPC network, firewall rules, images, snapshots, global load balancer, Pub/Sub, IAM.\n- Multi-region is a location type some services offer (Cloud Storage, BigQuery, Spanner, Firestore): Google replicates across regions for you.\n- Choosing a region: latency to users, data residency law, price (it varies by region), which services and machine types exist there, carbon footprint.\n- A zone is a deployment area inside a region, not one building. Treat it as a single failure domain.\nLike what I know: AWS regions and availability zones: same idea. Or CDN regions, except here I choose where things run.\n\n## Isolate\nPick it when: Surviving a zone failure is enough: spread across zones in one region (regional MIGs, regional GKE, Cloud SQL HA).\nNot it when (use multiple regions instead): The scenario mentions region-wide outages, disaster recovery, or users on several continents.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-resource-hierarchy","name":"Resource hierarchy","district":"core","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: The tree every resource sits in: organization node, then folders (optional, nestable), then projects, then resources. IAM and org policies set at any level flow down to everything below. Resource Manager is the service that manages it.\n- Project: the base unit for billing, enabling APIs and quotas. Every resource belongs to one. Project ID is globally unique and can't change after creation.\n- Folders group projects by team, department or environment. An isolation boundary between projects, and a way to delegate admin rights.\n- Organization node: the root, tied to a Cloud Identity or Workspace domain and created automatically when a user from that domain creates a project. Holds org-wide roles like Organization Admin (sets IAM policies, useful for auditing) and Project Creator.\n- Resource Manager roles per level, inherited top-down: organization (Admin, Viewer), folder (Admin, Creator, Viewer), project (Creator, Deleter).\n- Labels: key-value pairs on resources (VMs, disks, snapshots, images) for cost breakdowns and bulk scripts, e.g. by team or cost center. Network tags are different: instances only, used for firewall rules and routes.\n- A project has three identifiers: name (yours, changeable), ID (unique, permanent), number (assigned by Google).\n- A resource has one project; a project has one parent. Folders nest up to 10 levels.\n- Moving a project to another folder changes what it inherits: the new parent's IAM and org policies apply.\n- Typical layout: folders by environment or business unit, one project per app per environment. Separate projects are the cheap way to separate blast radius, quotas and billing.\nLike what I know: A GitHub organization, then teams, then repositories: settings and access granted higher up apply to everything below.\n\n## Isolate\nPick it when: Separating teams or environments (dev and prod in separate projects, grouped in folders) and applying one policy to many projects at once.\nNot it when (use labels instead): You only need to tag resources for cost reports or filtering. Labels don't change access.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-service-accounts","name":"Service accounts","district":"core","threat":3,"estimate":true,"livesAt":"global","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: An identity for a workload (VM, app, pipeline) instead of a person, so it can call Google APIs, e.g. a VM reading a Cloud Storage bucket. Identified by an email address and given roles through IAM like any principal.\n- It's also a resource: you control who can use or impersonate it (Service Account User role).\n- Attach it to the VM or Cloud Run service and Google handles short-lived credentials. User-managed (downloaded) keys are a last resort.\n- If you do use keys: up to 10 per service account so they can be rotated, and Google keeps only the public half, so a lost private key can't be recovered. Rotate and audit them.\n- Prefer one dedicated service account per app with only the roles it needs over the default Compute Engine one.\n- On GKE: Workload Identity Federation for GKE gives pods an IAM identity through their Kubernetes service account. A Kubernetes service account and an IAM service account are different things until that's set up. See compute-gke.\n- Kinds: user-managed (you create it), default (auto-created for Compute Engine and App Engine, historically with the Editor role, which is too broad), and service agents (Google's own services acting inside your project).\n- Impersonation: grant Service Account Token Creator so a user or another service account gets short-lived credentials as this one. No key leaves Google.\n- An org policy can forbid key creation outright (`iam.disableServiceAccountKeyCreation`).\n- Access scopes on a VM are the legacy limiter. Set the scope to cloud-platform and control access with IAM roles.\nLike what I know: A bot account or deploy token for CI: an identity for a machine rather than a person.\n\n## Isolate\nPick it when: Code or a machine needs to call Google Cloud APIs without a person signed in.\nNot it when (use Workload Identity Federation instead): The workload runs outside Google Cloud (on-prem, AWS, GitHub Actions). Federate its existing identity instead of exporting a key.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"core-well-architected-framework","name":"Well-Architected Framework","district":"core","threat":2,"estimate":true,"livesAt":"","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google Cloud's set of design recommendations, organised into pillars (it used to be called the Architecture Framework). The exam guide expects familiarity with it (1.2) and gives the operational excellence pillar its own section (6.1).\n- Pillars: operational excellence (deploy, operate, monitor and improve; automate; manage change and incidents), security, privacy and compliance, reliability (user-focused targets, redundancy, graceful degradation, tested recovery), cost optimization (visibility, right-sizing, discounts, a FinOps habit), performance optimization (plan capacity, scale elastically, measure and tune), and sustainability (the newest: energy-efficient, carbon-aware workloads).\n- Perspectives cut across the pillars for one field, e.g. AI and ML.\n- Ideas that recur in answers: prefer managed services, automate, decouple components, keep services stateless, design for failure, design for change.\n- Trade-offs are the point: more reliability and performance cost more. The best exam answer meets the stated requirement with the least cost and operational effort, not the most powerful design.\n- Lives in the Architecture Center, next to the reference architectures.\nLike what I know: The AWS Well-Architected pillars, or the categories of a Lighthouse report: a checklist to review a design against.\n\n## Isolate\nPick it when: A question asks for a recommended practice, a design review, or which trade-off to accept. Reason from the pillar the requirement belongs to.\nNot it when (use the SRE practices instead): The question is specifically about SLOs, error budgets or incident handling. `ops-sre-slos` goes deeper on that part of the reliability pillar.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-bigquery","name":"BigQuery","district":"data","threat":2,"estimate":true,"livesAt":"regional or multi-region (set per dataset)","b":true,"i":true,"e":true,"level":3,"missed":[],"body":"\n## Baseline\nWhat it is: Data warehouse that stores data and gives an interactive SQL interface to query it.\n- Layout: project, then dataset (has a location and an optional default table expiration), then tables.\n- Loads files from Cloud Storage (e.g. Avro) and builds the schema from what it finds in the file.\n- In a query, dataset ID and table ID are required. Project ID is optional and defaults to the current project.\n- Cloud Billing can export straight to BigQuery for cost analysis.\n- Serverless: storage and compute are separate and billed separately. Compute is on-demand (per TB scanned) or capacity-based (reserved slots).\n- Cheaper, faster queries: partition tables (usually by date), cluster them, select only the columns needed, never SELECT * on a big table.\n- Getting data in as it happens: the Storage Write API, a Pub/Sub BigQuery subscription, or Dataflow.\n- Query without loading: external tables over Cloud Storage files, and federated queries to Cloud SQL and Spanner.\n- BigQuery ML trains and runs models in SQL and can call Gemini over table rows. BI tools sit on top for dashboards.\n- Access: IAM at project, dataset and table level, plus column-level and row-level security. An authorized view shares a query result without exposing the tables behind it.\n- Time travel recovers table data from the last 7 days.\n- Sharing or selling data (KnightMotives wants to monetize data): BigQuery sharing, formerly Analytics Hub, publishes datasets without copying them.\nLike what I know: SQL I already know, pointed at an analytics-sized dataset, with no server to size or index to tune.\n\n## Isolate\nPick it when: SQL analytics over a large dataset: reporting, a data warehouse, digging through billing data.\nNot it when (use Cloud SQL or Spanner instead): The app needs a transactional database it reads and writes row by row. For fast key lookups at scale, Bigtable.\n\n## Execute\nWhat I built: Lab, analysing a billing export. Created a dataset, loaded an Avro file from a bucket into a native table (415,602 rows), then queried it. Compute Engine had the highest total cost.\n\n```sql\nSELECT service.description, ROUND(SUM(cost),2) AS total_cost\nFROM `billing_dataset.sampleinfotable`\nGROUP BY service.description\nORDER BY total_cost DESC\n```\n\nCourse lab, 2026-11-24. Queried VPC Flow Logs that a Cloud Logging sink wrote into a dataset, to rank source IPs by bytes sent to a web server. Query is on the `ops-logging` card.\n\n## Missed\n"},{"id":"data-bigtable","name":"Bigtable","district":"data","threat":2,"estimate":true,"livesAt":"zonal clusters, replicable across regions","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Google's wide-column NoSQL database for huge workloads at consistent low latency and high throughput (powers Search, Maps, Gmail). Built for fast lookups and scans by row key, not relational queries. HBase-compatible.\n- Scale by adding nodes; throughput grows with them.\n- Row key design decides performance.\n- Fed by streaming (Dataflow, Spark) or batch (Dataflow, Hadoop, Spark).\n- No joins, no multi-row transactions, one index: the row key. Sequential keys (a timestamp first) put all writes on one node, a hot spot. Lead with a well-spread field.\n- Replication across zones or regions; app profiles route requests. Replicas are eventually consistent. Up to 99.999% availability with multi-region replication.\n- SSD or HDD storage, chosen at creation. Autoscaling adds and removes nodes.\n- Has a local emulator (the exam guide lists emulators for Bigtable, Spanner, Pub/Sub and Firestore).\n- Case study hook: vehicle or sensor telemetry at scale (KnightMotives) is the classic Bigtable shape.\nLike what I know: One enormous sorted key-value map: fast get by key or key range, no joins. Closer to DynamoDB or Cassandra than to a SQL database.\n\n## Isolate\nPick it when: More than 1 TB with heavy, low-latency reads and writes: IoT and sensor time series, financial ticks, ad tech, user analytics serving, or moving off HBase.\nNot it when (use BigQuery instead): You need SQL analytics across the whole dataset rather than fast key lookups. For small app data, Firestore.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-cloud-sql","name":"Cloud SQL","district":"data","threat":3,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Fully managed relational database: MySQL, PostgreSQL, SQL Server. Google handles patches, backups, replication and failover.\n- High availability: a standby in another zone of the same region, automatic failover.\n- Read replicas, including cross-region, for scaling reads and disaster recovery. HA is failover inside one region; it does nothing for read latency elsewhere.\n- Scales up (bigger machine), not out: writes go to one primary.\n- Sizing: shared-core machines are for prototyping and aren't covered by the SLA. For OLTP, give it enough memory to hold the whole working set plus the active connections. More vCPUs raise the network throughput cap.\n- Storage: SSD suits most cases. HDD (Enterprise edition only) is slower but cheaper, for rarely accessed data that doesn't need low latency. Disk throughput grows with storage capacity.\n- Database Center: one dashboard for health, security and performance issues across the whole database fleet (Cloud SQL, AlloyDB, Spanner, Bigtable, Firestore, Memorystore), across projects. The database counterpart of Security Command Center.\n- Backups: automated daily plus on demand. Point-in-time recovery replays the logs to any moment in the retention window. That is how you undo a bad write or a dropped table; HA faithfully copies the mistake to the standby.\n- Connecting: private IP (through private services access) from anything in the VPC. The Cloud SQL Auth Proxy and the language connectors give encrypted, IAM-authorised connections with no certificates or IP allowlists to manage.\n- Editions: Enterprise, and Enterprise Plus (99.99% SLA, near-zero downtime maintenance, faster failover).\n- Maintenance windows and deny periods control when Google patches.\n- Ceilings that push toward Spanner: storage tops out at 64 TB and there is one writer.\n- Moving an existing database in with little downtime: Database Migration Service, see `migrate-database-migration`.\nLike what I know: The MySQL or PostgreSQL behind an ordinary web app, with the DBA chores handed to Google. AWS RDS.\n\n## Isolate\nPick it when: A standard relational workload (web app, CRM, ERP), often a lift-and-shift of an existing MySQL, PostgreSQL or SQL Server database running on a single machine.\nNot it when (use Spanner instead): It needs horizontal write scaling, global strong consistency or 99.999% availability. For demanding PostgreSQL workloads that mix transactions and analytics, AlloyDB.\n- Rarely changing lookup data that apps in new regions only read: cross-region read replicas. Spanner is overkill and HA doesn't help.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-cloud-storage","name":"Cloud Storage","district":"data","threat":3,"estimate":true,"livesAt":"region, dual-region or multi-region","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Object storage (objects, not files and folders or disk blocks) for unstructured data. 11 nines durability. Buckets need a globally unique name and a location: region, dual-region or multi-region, picked near users.\n- Classes by how often data is read: Standard (hot), Nearline (about monthly, 30-day minimum), Coldline (at most every 90 days, 90-day minimum), Archive (under once a year, 365-day minimum). Colder means cheaper storage, pricier retrieval, same millisecond access.\n- Objects are immutable. Versioning keeps old versions; without it, changes overwrite.\n- Access: IAM inherited project to bucket to object. Uniform bucket-level access (IAM only) is Google's recommended setting; ACLs are for per-object permissions and count as legacy. Encrypted at rest and in transit by default.\n- Lifecycle rules (Object Lifecycle Management) archive or delete by age; a new or changed rule can take up to 24 hours to take effect. Autoclass moves objects between classes by access pattern.\n- Soft delete is on by default: deleted objects stay recoverable for 7 days.\n- Directory synchronization: keep a VM directory in sync with a bucket.\n- Location trade-off: region (cheapest, next to the compute), dual-region (two regions you choose, survives losing one; turbo replication for a 15-minute RPO), multi-region (spread over a continent, for serving).\n- Deleting or moving an object before its class's minimum duration is charged as if it had stayed the full time.\n- Retention policy plus bucket lock makes objects undeletable for a set period (compliance, write once read many). Object holds do it per object.\n- Signed URLs give time-limited access to one object without a Google account. Public access prevention stops a bucket being made public by accident.\n- CMEK when you must control the key.\n- CLI: `gcloud storage` replaces `gsutil` (the exam guide still names gsutil).\n- Static website: bucket as a backend bucket behind an Application LB with Cloud CDN.\n- Cloud Storage FUSE mounts a bucket like a folder, common for AI training data. It is not a real file system (no locking, slow renames).\nLike what I know: Amazon S3. The bucket behind static site hosting and user uploads.\n\n## Isolate\nPick it when: Unstructured objects of any size: media, backups, archives, data lake files, static website assets.\nNot it when (use Filestore or Persistent Disk instead): The app needs a mounted file system (Filestore, NFS) or a block disk for a VM (Persistent Disk).\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-dataflow","name":"Dataflow","district":"data","threat":2,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Serverless data processing for streaming and batch pipelines. It runs Apache Beam code; workers start for the job, autoscale and shut down, with no cluster to manage.\n- One model for streaming and batch, so it fits almost any ETL (extract, transform, load) pipeline.\n- Google's default recommendation for new pipelines.\n- Typical shape: Pub/Sub in, Dataflow in the middle, BigQuery or Bigtable out.\n- Streaming words to recognise: windows (group events by time), watermarks and triggers (how late data is handled), exactly-once processing.\n- Templates, Google's or your own, run common pipelines without writing code, e.g. Pub/Sub to BigQuery.\n- Look-alikes: Managed Service for Apache Spark (Dataproc) for Spark and Hadoop, Cloud Data Fusion for visual no-code ETL, Cloud Composer (managed Airflow) to orchestrate jobs across services, Dataform for SQL transformations inside BigQuery.\nLike what I know: RxJS operators (map, filter, window, merge) applied to a distributed stream instead of UI events.\n\n## Isolate\nPick it when: A new ETL or streaming pipeline with no existing Spark or Hadoop code to keep.\nNot it when (use Managed Service for Apache Spark, formerly Dataproc, instead): There's Spark or Hadoop code to keep, an on-prem Hadoop cluster to migrate, or the job needs Hive, Pig and the rest of that ecosystem.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-dataproc","name":"Managed Service for Apache Spark (Dataproc)","district":"data","threat":2,"estimate":true,"livesAt":"regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Managed Apache Spark and Hadoop. Dataproc was renamed Managed Service for Apache Spark in 2026; the exam question pool can still show either name.\n- Two deployments. Clusters (the old Dataproc on Compute Engine): you size the cluster and pay while it's up. Serverless: submit a Spark job and pay for its runtime.\n- Runs the Hadoop ecosystem: Spark, Hadoop, Hive, Pig.\n- Trainer: the serverless option blurs the old \"Dataflow, because there's no cluster\" reasoning in practice. For the exam, Dataflow is still the default for new pipelines and this is the migration answer.\n- Cost pattern: ephemeral clusters. Start a cluster for the job, keep the data in Cloud Storage instead of HDFS, delete the cluster afterwards. Spot VMs for the secondary workers.\n- The rename covers both forms: 'Dataproc on Compute Engine' is the cluster deployment and 'Serverless for Apache Spark' is the serverless one.\nLike what I know: Renting a ready-made Spark cluster instead of installing Hadoop yourself. AWS EMR.\n\n## Isolate\nPick it when: Moving an on-prem Hadoop or Spark cluster to Google Cloud, or keeping an investment in existing Spark code. \"Spark\" or \"Hadoop\" in the scenario gives it away.\nNot it when (use Dataflow instead): It's a new pipeline with no Spark or Hadoop to preserve.\n\n## Execute\nWhat I built:\n\n## Missed\n"},{"id":"data-filestore","name":"Filestore","district":"data","threat":1,"estimate":true,"livesAt":"zonal or regional","b":true,"i":true,"e":false,"level":2,"missed":[],"body":"\n## Baseline\nWhat it is: Managed network file storage (NFS). A file share with folders and files that many VMs or GKE pods mount at the same time and use like a local directory.\n- Tiers: Basic (HDD or SSD, one zone, simple shares; now labelled legacy), Zonal (more capacity and performance), Regional (replicated across zones), Enterprise (regional, for critical apps). New instances: Zonal or Regional.\n- Sits on a VPC network and is reached over internal IPs. Capacity is provisioned up front, so it costs more per GB than Cloud Storage.\n- Backups on every tier; snapshots on all but Basic.\n- GKE: the Filestore CSI driver gives pods a volume that many pods can write at once (ReadWriteMany), which an ordinary disk can't.\n- A parallel file system for HPC or AI training is Managed Lustre, not Filestore.\nLike what I know: A shared network drive (NAS) mounted by several machines.\n\n## Isolate\nPick it when: A lift-and-shift app that expects a shared file system: content management, shared home directories, rendering, legacy apps that write to a common folder.\nNot it when (use Cloud Storage instead): Objects serve
